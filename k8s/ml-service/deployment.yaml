apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthgenie-ml-service
  namespace: wealthgenie
  labels:
    app: wealthgenie-ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wealthgenie-ml-service
  template:
    metadata:
      labels:
        app: wealthgenie-ml-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ml-service
          image: wealthgenie-ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: wealthgenie-config
          env:
            - name: PORT
              value: "8000"
            - name: TRACE_LOG_PATH
              value: "/app/traces.jsonl"
            - name: ENVIRONMENT
              value: "production"
            - name: RAG_EMBEDDING_PROVIDER
              value: sentence_transformer
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: MONGODB_URI
            - name: ML_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: ML_SERVICE_API_KEY
            - name: ML_OPERATOR_KEY
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: ML_OPERATOR_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
