apiVersion: v1
kind: ConfigMap
metadata:
  name: wealthgenie-config
  namespace: wealthgenie
  labels:
    app.kubernetes.io/name: wealthgenie
data:
  NODE_ENV: "production"
  PORT: "5000"
  ML_PORT: "8000"
  ENVIRONMENT: "production"
  ML_STATE_BACKEND: "mongodb"
  MONGODB_FLAVOR: "mongodb"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: "strict"
  LLM_DEFAULT_PROVIDER: "mock"
  # Secure defaults: an operator selects the mode only after source rights
  # and provider-specific credentials have been verified independently.
  MARKET_DATA_MODE: "LEGACY"
  MARKET_DATA_PRIMARY_PROVIDER: "NSE"
  UPSTOX_PUBLIC_MARKET_DATA_LICENSE_CONFIRMED: "false"
  TEJHQ_ENABLED: "false"
  TEJHQ_LICENSE_CONFIRMED: "false"
  TEJHQ_HISTORICAL_FALLBACK_ENABLED: "false"
  TEJHQ_ADJUSTED_HISTORY_ENABLED: "false"
  TEJHQ_CORPORATE_ACTIONS_ENABLED: "false"
  TEJHQ_INTERNAL_DAILY_REQUEST_BUDGET: "200"
  LLM_PRIMARY_PROVIDER: "GROQ"
  GROQ_MODEL: "openai/gpt-oss-120b"
  NVIDIA_NIM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  NVIDIA_NIM_MODEL: "nvidia/nemotron-3.5-lightning-30b-a3b"
  LLM_GEMINI_FALLBACK_ENABLED: "false"
  ML_SERVICE_URL: "http://wealthgenie-ml-service.wealthgenie.svc.cluster.local:8000"
  REDIS_URL: "redis://wealthgenie-redis.wealthgenie.svc.cluster.local:6379"
  # Kind/demo ingress origin. Production overlays must replace this with the
  # real HTTPS frontend origin; validation intentionally rejects HTTP origins.
  CORS_ORIGINS: "https://wealthgenie.local"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  AGENT_WORKER_MODE: "external"
  AGENT_WORKER_ENABLED: "false"
  AGENTIC_PLAN_REVIEW_ENABLED: "false"
  PLAN_HEALTH_SCHEDULER_ENABLED: "false"
