apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthgenie-server
  namespace: wealthgenie
  labels:
    app: wealthgenie-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wealthgenie-server
  template:
    metadata:
      labels:
        app: wealthgenie-server
    spec:
      containers:
        - name: server
          image: wealthgenie-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: wealthgenie-config
          env:
            - name: PORT
              value: "5000"
            - name: TRACE_LOG_PATH
              value: "/app/traces.jsonl"
            - name: APP_BUILD_PROVENANCE_PATH
              value: "/run/wealthgenie/build-provenance/provenance.json"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: MONGODB_URI
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: GEMINI_API_KEY
            # Provider-only credentials never enter the browser or ML pods.
            # Missing secrets are allowed; provider use remains rights-gated.
            - name: UPSTOX_ANALYTICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: UPSTOX_ANALYTICS_TOKEN
                  optional: true
            - name: UPSTOX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: UPSTOX_ACCESS_TOKEN
                  optional: true
            - name: TEJHQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: TEJHQ_API_KEY
                  optional: true
            - name: ML_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: ML_SERVICE_API_KEY
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: METRICS_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: build-provenance
              mountPath: /run/wealthgenie/build-provenance
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: build-provenance
          configMap:
            name: wealthgenie-build-provenance
            optional: true
