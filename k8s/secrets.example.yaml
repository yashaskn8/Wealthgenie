apiVersion: v1
kind: Secret
metadata:
  name: wealthgenie-secrets
  namespace: wealthgenie
  labels:
    app.kubernetes.io/name: wealthgenie
type: Opaque
# NOTE: In production or CI, populate these using sealed-secrets, Vault, or:
# kubectl create secret generic wealthgenie-secrets -n wealthgenie \
#   --from-literal=JWT_SECRET="your-32-char-min-jwt-secret" \
#   --from-literal=GEMINI_API_KEY="your-gemini-api-key" \
#   --from-literal=ML_SERVICE_API_KEY="your-ml-service-api-key" \
#   --from-literal=ML_OPERATOR_KEY="your-ml-operator-key" \
#   --from-literal=METRICS_TOKEN="your-32-char-min-metrics-token" \
#   --from-literal=REDIS_PASSWORD="your-random-32-char-min-redis-password" \
#   --from-literal=MONGODB_URI="mongodb://wealthgenie-mongodb.wealthgenie.svc.cluster.local:27017/wealthgenie?replicaSet=rs0"
stringData:
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_MINIMUM_32_CHARACTERS_REQUIRED"
  GEMINI_API_KEY: "CHANGE_ME_GEMINI_API_KEY"
  # Optional credentials. Populate from a secrets manager only when use is authorized.
  GROQ_API_KEY: "CHANGE_ME_GROQ_API_KEY"
  NVIDIA_API_KEY: "CHANGE_ME_NVIDIA_API_KEY"
  UPSTOX_ANALYTICS_TOKEN: "CHANGE_ME_UPSTOX_ANALYTICS_TOKEN"
  UPSTOX_ACCESS_TOKEN: "CHANGE_ME_UPSTOX_ACCESS_TOKEN"
  TEJHQ_API_KEY: "CHANGE_ME_TEJHQ_API_KEY"
  ML_SERVICE_API_KEY: "CHANGE_ME_ML_SERVICE_API_KEY"
  ML_OPERATOR_KEY: "CHANGE_ME_ML_OPERATOR_KEY"
  METRICS_TOKEN: "CHANGE_ME_METRICS_TOKEN_AT_LEAST_32_CHARACTERS"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD_AT_LEAST_32_CHARACTERS"
  MONGODB_URI: "mongodb://wealthgenie-mongodb.wealthgenie.svc.cluster.local:27017/wealthgenie?replicaSet=rs0"
