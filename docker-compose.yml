version: '3.8'

services:
  mongodb:
    image: mongo:7.0@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    container_name: wealthgenie-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}) }'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
    container_name: wealthgenie-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: wealthgenie-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TRACE_LOG_PATH=/app/traces.jsonl
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      # Docker Compose is the local HTTP integration stack. Production must
      # terminate HTTPS and provide independently managed secrets.
      - NODE_ENV=development
      - AGENT_WORKER_MODE=external
      - AGENT_WORKER_ENABLED=false
      - JWT_SECRET=${JWT_SECRET:-local-compose-jwt-secret-at-least-32-characters}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Explicitly forward read-only provider credentials. Compose does NOT
      # implicitly inject host .env values into the running container.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-GROQ}
      - UPSTOX_ANALYTICS_TOKEN=${UPSTOX_ANALYTICS_TOKEN:-}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN:-}
      - TEJHQ_API_KEY=${TEJHQ_API_KEY:-}
      - MARKET_DATA_MODE=${MARKET_DATA_MODE:-LEGACY}
      - MARKET_DATA_PRIMARY_PROVIDER=${MARKET_DATA_PRIMARY_PROVIDER:-NSE}
      - UPSTOX_PUBLIC_MARKET_DATA_LICENSE_CONFIRMED=${UPSTOX_PUBLIC_MARKET_DATA_LICENSE_CONFIRMED:-false}
      - TEJHQ_ENABLED=${TEJHQ_ENABLED:-false}
      - TEJHQ_LICENSE_CONFIRMED=${TEJHQ_LICENSE_CONFIRMED:-false}
      - TEJHQ_HISTORICAL_FALLBACK_ENABLED=${TEJHQ_HISTORICAL_FALLBACK_ENABLED:-false}
      - TEJHQ_ADJUSTED_HISTORY_ENABLED=${TEJHQ_ADJUSTED_HISTORY_ENABLED:-false}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAME_SITE=${AUTH_COOKIE_SAME_SITE:-strict}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      - MONGODB_FLAVOR=${MONGODB_FLAVOR:-mongodb}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          - wealthgenie-server

  agent-worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: wealthgenie-agent-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    expose:
      - "5050"
    environment:
      - TRACE_LOG_PATH=/app/traces-worker.jsonl
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - AGENT_WORKER_MODE=external
      - AGENT_WORKER_ENABLED=true
      - AGENT_WORKER_HEALTH_PORT=5050
      - JWT_SECRET=${JWT_SECRET:-local-compose-jwt-secret-at-least-32-characters}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - REQUIRE_REDIS=${REQUIRE_REDIS:-false}
      - MONGODB_FLAVOR=${MONGODB_FLAVOR:-mongodb}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5050/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
    networks:
      default:
        aliases:
          - wealthgenie-agent-worker

  reactapp:
    build:
      context: .
      dockerfile: reactapp/Dockerfile
    container_name: wealthgenie-reactapp
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: wealthgenie-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TRACE_LOG_PATH=/app/traces.jsonl
      - ENVIRONMENT=production
      - ML_STATE_BACKEND=mongodb
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      # External PlanReview execution runs in this separate worker process.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-GROQ}
      - LLM_GEMINI_FALLBACK_ENABLED=${LLM_GEMINI_FALLBACK_ENABLED:-false}
      - ML_OPERATOR_KEY=${ML_OPERATOR_KEY:-}
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie?replicaSet=rs0
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
