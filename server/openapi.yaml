        fiscalYear: { type: string, pattern: '^FY\d{4}-\d{2}$' }
        policyVersion: { type: string, minLength: 1 }
        statuteMetadata: { type: object, additionalProperties: true }
        verifiedRuleIds: { type: array, items: { type: string } }
        sourceReferences: { type: array, items: { type: object, additionalProperties: true } }
        rules: { type: object, additionalProperties: true }
        assumptions:
          type: object
          required: [annualIncome, incomeSource, regime, userAge, inflationRate, fiscalYear, deductions, contributionGrowthRate, calculationClass, dataClass, taxEventModel, section112APortfolioAllocation]
          properties:
            annualIncome: { type: number, minimum: 0 }
            incomeSource: { type: string, enum: [salary, pension, family_pension, business, other] }
            regime: { type: string, enum: [new] }
            userAge: { type: integer, minimum: 18, maximum: 120 }
            inflationRate: { type: number, minimum: 0, maximum: 1 }
            fiscalYear: { type: string, pattern: '^FY\d{4}-\d{2}$' }
            deductions: { $ref: '#/components/schemas/TaxDeductionInputs', description: Exact validated deduction object used by the calculation; an omitted request value is normalized to an empty object. }
            contributionGrowthRate: { type: number, const: 0 }
            calculationClass: { type: string, const: MODELLED_POST_TAX_PROJECTION }
            dataClass: { type: string, const: MODEL_ASSUMPTION }
            taxEventModel: { type: string, const: GROSS_FLOWS_THEN_EXPLICIT_TAX_EVENTS }
            section112APortfolioAllocation: { type: [object, 'null'], additionalProperties: true }
          additionalProperties: true
        inputsUsed:
          type: object
          required: [annualIncome, incomeSource, regime, userAge, inflationRate, fiscalYear, deductions, section112AExemptionUsed, instruments]
          properties:
            annualIncome: { type: number, minimum: 0 }
            incomeSource: { type: string, enum: [salary, pension, family_pension, business, other] }
            regime: { type: string, enum: [new] }
            userAge: { type: integer, minimum: 18, maximum: 120 }
            inflationRate: { type: number, minimum: 0, maximum: 1 }
            fiscalYear: { type: string, pattern: '^FY\d{4}-\d{2}$' }
            deductions: { $ref: '#/components/schemas/TaxDeductionInputs', description: Exact validated deduction object used by the calculation; an omitted request value is normalized to an empty object. }
            section112AExemptionUsed: { type: [number, 'null'], minimum: 0, maximum: 125000, description: Null means the request omitted prior annual taxpayer-wide Section 112A usage; zero is an explicit value. }
            instruments: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/PostTaxInstrument' }, description: Exact normalized instrument array validated and used for this calculation. }
          additionalProperties: true
        rulesApplied: { type: array, items: { type: [string, 'null'] } }
        unavailableReasons: { type: array, items: { type: string } }
        results:
          type: array
          items:
            type: object
            required: [instrumentIndex, instrumentInput, instrumentType, status, sipReturnMetrics]
            properties:
              instrumentIndex: { type: integer, minimum: 0, description: Zero-based index assigned during that instrument's calculation and retained through any Section 112A recalculation. }
              instrumentInput: { $ref: '#/components/schemas/PostTaxInstrument', description: 'Exact normalized per-row input used for this result and preserved through any Section 112A recalculation; clients must compare it with the original request row before displaying the result.' }
              instrumentId: { type: [string, 'null'], description: Catalog identity echoed for a given projection result; null when no identity was supplied. }
              exactProductReturnVerified: { type: boolean, const: false, description: Generic category model assumptions cannot establish an exact product-specific post-tax return. }
              instrumentType: { type: string }
              status: { type: string, enum: [CALCULATED, REQUIRES_TAX_INPUTS, TAX_CLASSIFICATION_REQUIRES_ACQUISITION_FACTS, MODEL_TAX_CLASS_UNAVAILABLE, MODELLED_POST_TAX_PROJECTION_UNAVAILABLE] }
              modelTaxClass: { type: [string, 'null'] }
              taxClass: { type: [string, 'null'] }
              taxType: { type: [string, 'null'] }
              calculationClass: { type: string, const: MODELLED_POST_TAX_PROJECTION }
              dataClass: { type: string, const: MODEL_ASSUMPTION }
              fiscalYear: { type: [string, 'null'] }
              policyVersion: { type: [string, 'null'] }
              grossGain: { type: [number, 'null'], description: Null when the required tax calculation is unavailable. }
              taxableGain: { type: [number, 'null'], description: Null when the required tax calculation is unavailable. }
              netGain: { type: [number, 'null'], description: Null when the required tax calculation is unavailable. }
              postTaxReturn: { type: [number, 'null'], description: Null when tax inputs, tax classification, or the projection are unavailable. }
              taxRate: { type: [number, 'null'], description: Null when the required tax calculation is unavailable. }
              incrementalTax: { type: [number, 'null'] }
              cess: { type: [number, 'null'] }
              surcharge: { type: [number, 'null'] }
              totalInvested: { type: number, minimum: 0 }
              nominalFutureValue: { type: [number, 'null'], minimum: 0, description: Null when the modeled future value would exceed safe INR numeric precision. }
              postTaxFutureValue: { type: [number, 'null'] }
              realFutureValue: { type: [number, 'null'] }
              postTaxGain: { type: [number, 'null'] }
              taxDragWealth: { type: [number, 'null'] }
              nominalReturnPercent: { type: number }
              postTaxReturnPercent:
                type: [number, 'null']
                deprecated: true
                description: Legacy percentage-valued metric derived from the total-contributed-principal CAGR. It does not account for monthly contribution timing and is preserved for compatibility; use sipReturnMetrics.postTaxAnnualizedReturnPercent for the modeled SIP equivalent annual rate. Null when the projection is unavailable or no contributions were invested.
              realReturnPercent:
                type: [number, 'null']
                deprecated: true
                description: Legacy percentage-valued real metric derived from the total-contributed-principal CAGR. It does not account for monthly contribution timing and is preserved for compatibility; use sipReturnMetrics.realPostTaxAnnualizedReturnPercent for the modeled real SIP equivalent annual rate. Null when the projection is unavailable or no contributions were invested.
              effectiveTaxPercent: { type: [number, 'null'] }
              sipReturnMetrics: { $ref: '#/components/schemas/SipReturnMetrics' }
              taxDragCAGR:
                type: [number, 'null']
                deprecated: true
                description: Legacy difference between total-contributed-principal CAGR values stored as a decimal fraction (for example, 0.01 means one percentage point). It does not account for monthly contribution timing and is preserved for compatibility; use sipReturnMetrics.taxDragAnnualizedPercentagePoints for modeled SIP tax drag in percentage points. Null when the projection is unavailable.
              postTaxCAGR:
                type: [number, 'null']
                deprecated: true
                description: Legacy total-contributed-principal projection CAGR stored as a decimal fraction (for example, 0.07 means 7 percent). It does not account for monthly contribution timing and is preserved for compatibility; use sipReturnMetrics.postTaxAnnualizedReturnPercent for the modeled SIP equivalent annual rate in percent. Null when unavailable.
              nominalCAGR:
                type: [number, 'null']
