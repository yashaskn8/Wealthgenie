openapi: 3.1.0
info:
  title: WealthGenie Public API
  version: 2.0.0
  description: Canonical contract for the supported public Express API. Internal metrics and MCP routes are intentionally excluded.
servers:
  - { url: 'http://localhost:5000', description: Local development }
  - { url: '/', description: Same-origin production gateway }

paths:
  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses: { '201': { $ref: '#/components/responses/AuthSession' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/auth/login:
    post:
      operationId: loginUser
      tags: [Authentication]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses: { '200': { $ref: '#/components/responses/AuthSession' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/logout:
    post:
      operationId: logoutUser
      tags: [Authentication]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      responses: { '200': { $ref: '#/components/responses/Message' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/auth/session:
    get:
      operationId: restoreSession
      tags: [Authentication]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Session revocation status could not be verified because the revocation service is unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    required: [code]
                    properties:
                      code: { type: string, const: TOKEN_REVOCATION_UNAVAILABLE }

  /api/profile/build:
    post:
      operationId: buildProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: required
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ProfileCreate' }
      responses: { '201': { $ref: '#/components/responses/Profile' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' }, '429': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/profile/precompute:
    post:
      operationId: precomputeProfileRecommendation
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: optional
      description: Server-side, short-lived non-authoritative recommendation precomputation. It does not persist profile, recommendation, or audit records.
      requestBody: { $ref: '#/components/requestBodies/ProfileCreate' }
      responses: { '200': { $ref: '#/components/responses/ProfileCandidate' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/profile/complete:
    post:
      operationId: completeFinancialProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: required
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      description: Authoritative profile completion boundary. Commits the profile, recommendation, audit record, and idempotency result atomically. The financial response is reconstructed from canonical current state; if a newer generation wins before response construction, operation_result identifies the committed generation separately. Advisory prose remains deferred.
      requestBody: { $ref: '#/components/requestBodies/ProfileCompletion' }
      responses: { '200': { $ref: '#/components/responses/ProfileCompletion' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/profile/current:
    get:
      operationId: getCurrentProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Profile' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/profile/{profileId}:
    put:
      operationId: updateProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: required
      parameters: [{ $ref: '#/components/parameters/ProfileId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/ProfileUpdate' }
      description: Atomically commits the profile revision and its replacement canonical recommendation, allocation revision, pointer, audit entry, and idempotency result. Recommendation computation runs before the short commit transaction.
      responses: { '200': { $ref: '#/components/responses/ProfileUpdate' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/Unprocessable' }, '502': { $ref: '#/components/responses/BadGateway' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/recommend:
    post:
      operationId: createRecommendation
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: required
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      description: Commits a recommendation and audit record atomically. The response represents canonical current state; if a newer generation wins before response construction, operation_result identifies the generation committed by this operation.
      requestBody: { $ref: '#/components/requestBodies/Recommendation' }
      responses: { '200': { $ref: '#/components/responses/Recommendation' }, '201': { $ref: '#/components/responses/Recommendation' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/recommend/current:
    get:
      operationId: getCurrentRecommendation
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters: [{ name: profileId, in: query, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }]
      responses: { '200': { $ref: '#/components/responses/Recommendation' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/recommend/audit:
    get:
      operationId: listRecommendationAudits
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: profileId, in: query, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, x-raw-query-pattern: '^(0|[1-9][0-9]*)$' } }
        - { name: skip, in: query, schema: { type: integer, minimum: 0, maximum: 10000000, x-raw-query-pattern: '^(0|[1-9][0-9]*)$' } }
        - { name: correlationId, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' } }
      responses: { '200': { description: Owned paginated audit records, content: { application/json: { schema: { $ref: '#/components/schemas/AuditListResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/recommend/audit/verify:
    get:
      operationId: verifyRecommendationAuditChain
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses:
        '200': { description: Valid tamper-evident chain, content: { application/json: { schema: { $ref: '#/components/schemas/AuditVerification' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Chain verification found an integrity discrepancy, content: { application/json: { schema: { $ref: '#/components/schemas/AuditVerification' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/recommend/audit/{id}:
    get:
      operationId: getRecommendationAudit
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Owned audit record with distributable generation evidence, content: { application/json: { schema: { $ref: '#/components/schemas/AuditMetadata' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/recommend/weights:
    post:
      operationId: updateRecommendationWeights
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/RecommendationWeights' }
      responses: { '200': { $ref: '#/components/responses/Recommendation' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }
  /api/recommend/{recommendationId}/advisory:
    post:
      operationId: generateDeferredAdvisory
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ name: recommendationId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }]
      responses: { '200': { $ref: '#/components/responses/DeferredAdvisory' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/agent/plan-review:
    post:
      operationId: enqueuePlanReview
      tags: [Agent]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      description: Bounded, read-only evidence review. It never changes profiles, recommendations, goals, allocations, or weights. The feature is controlled by AGENTIC_PLAN_REVIEW_ENABLED.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanReviewRequest' } } } }
      responses: { '202': { $ref: '#/components/responses/PlanReviewRun' }, '200': { $ref: '#/components/responses/PlanReviewRun' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/genieproof/capabilities:
    get:
      operationId: getGenieProofCapabilities
      tags: [GenieProof]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      description: Authenticated, non-cacheable readiness status. Only explicitly configured direct-loopback local research may be interactive; forwarded or proxied requests cannot use signed routes. This does not qualify production financial evidence, authorize a signed finding, or reveal signing keys.
      responses:
        '200':
          description: Sanitized capability status
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [interactiveEnabled, extractionPreviewEnabled, mode, reasonCode, productionVerified]
                additionalProperties: false
                properties:
                  interactiveEnabled: { type: boolean }
                  extractionPreviewEnabled: { type: boolean, const: true }
                  mode: { type: string, enum: [LOCAL_RESEARCH, UNAVAILABLE] }
                  reasonCode: { type: string, enum: [RESEARCH_ONLY_SOURCE_RIGHTS_NOT_QUALIFIED, FEATURE_UNAVAILABLE, GENIEPROOF_LOCAL_RESEARCH_ONLY, GENIEPROOF_FLAG_DISABLED, GENIEPROOF_SIGNING_KEYS_MISSING, GENIEPROOF_SIGNING_CONFIGURATION_INVALID, GENIEPROOF_LOCAL_REQUEST_REQUIRED] }
                  productionVerified: { type: boolean, const: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/genieproof/calculate:
    post:
      operationId: calculateGenieProofScenario
      tags: [GenieProof]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      description: Integer-paise scenario arithmetic using ONLY the user's unverified rate and monetary assumptions. Not a market fact check, source verification or product guarantee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, amountRupees, annualRatePercent, months]
              properties:
                type: { type: string, enum: [LUMPSUM, SIP, EMI] }
                amountRupees: { type: string }
                annualRatePercent: { type: string }
                months: { type: integer, minimum: 1, maximum: 600 }
                stepUpPercent: { type: string }
                claimedResultRupees: { type: string }
      responses:
        '200':
          description: Read-only mathematical illustration; rates/terms not verified.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, mode, type, metric, months, assumptionRatePercent, assumptionSource, amountRupees, stepUpPercent, resultRupees, totalPaidOrContributedRupees, totalInterestRupees, lastInstallmentRupees, claimedResultRupees, absoluteDifferenceRupees, arithmeticFinding, convention, exclusions, caveat, saved]
                properties:
                  ok: { type: boolean, const: true }
                  mode: { type: string, const: USER_INPUT_MATH_CHECK }
                  type: { type: string, enum: [LUMPSUM, SIP, EMI] }
                  metric: { type: string, enum: [FUTURE_VALUE, MONTHLY_EMI] }
                  months: { type: integer, minimum: 1, maximum: 600 }
                  assumptionRatePercent: { type: string }
                  assumptionSource: { type: string, const: USER_SUPPLIED_NOT_VERIFIED }
                  amountRupees: { type: string }
                  stepUpPercent: { type: [string, 'null'] }
                  resultRupees: { type: string }
                  totalPaidOrContributedRupees: { type: string }
                  totalInterestRupees: { type: string }
                  lastInstallmentRupees: { type: [string, 'null'] }
                  claimedResultRupees: { type: [string, 'null'] }
                  absoluteDifferenceRupees: { type: [string, 'null'] }
                  arithmeticFinding: { type: string, enum: [CALCULATED_ONLY, MATCHES_ASSUMPTIONS_WITHIN_ONE_PAISE, DIFFERS_FROM_ASSUMPTIONS] }
                  convention: { type: string }
                  exclusions: { type: array, items: { type: string } }
                  caveat: { type: string }
                  saved: { type: boolean, const: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/Error' }
  /api/genieproof/check:
    post:
      operationId: checkGenieProofClaims
      tags: [GenieProof]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      description: Authenticated read-only check of submitted financial statements. No claim case or signed passport is created. Unqualified evidence yields NOT_VERIFIED.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenieProofExtractRequest' } } } }
      responses:
        '200':
          description: Nonpersistent bounded claim check with evidence-backed verdicts where available.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, mode, checkedAt, saved, claims, noClaimsFound, allExtractedCandidatesProcessed, verificationScope]
                properties:
                  ok: { type: boolean, const: true }
                  mode: { type: string, const: READ_ONLY_FINANCIAL_CLAIM_CHECK }
                  checkedAt: { type: string, format: date-time }
                  saved: { type: boolean, const: false }
                  noClaimsFound: { type: boolean }
                  allExtractedCandidatesProcessed: { type: boolean, const: true }
                  verificationScope: { type: string, const: DETECTED_CLAIMS_ONLY }
                  claims:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [claimId, statement, verdict, reasonCode, explanation, source, warningSignals]
                      properties:
                        claimId: { type: string, pattern: '^[a-f0-9]{32}$' }
                        statement: { type: string }
                        verdict: { type: string, enum: [SUPPORTED, CONTRADICTED, NOT_VERIFIED] }
                        reasonCode: { type: string }
                        explanation: { type: string }
                        source:
                          type: [object, 'null']
                          additionalProperties: false
                          required: [name, url, observedRatePercentPerAnnum, retrievedAt, effectiveFrom, effectiveTo]
                          properties:
                            name: { type: string, const: India Post — Savings }
                            url: { type: string, const: 'https://www.indiapost.gov.in/banking-services/savings' }
                            observedRatePercentPerAnnum: { type: number, minimum: 0, maximum: 100 }
                            retrievedAt: { type: string, format: date-time }
                            effectiveFrom: { type: string, format: date-time }
                            effectiveTo: { type: string, format: date-time }
                        warningSignals: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/Error' }
  /api/genieproof/nvidia-review:
    post:
      operationId: reviewGenieProofClaimWithNvidia
      tags: [GenieProof]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      description: Authenticated, rate-limited, explicitly consented next-step guidance for one already-checked claim statement. The model only selects among server-reviewed guidance IDs; it does not search, verify sources, or change the deterministic verdict. Returns status UNAVAILABLE with a reasonCode when consent, privacy, licensing or provider conditions are not met.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statement, claimId, consent]
              properties:
                statement: { type: string, minLength: 1, maxLength: 500 }
                claimId: { type: string, pattern: '^[a-f0-9]{32}$' }
                consent: { type: boolean, const: true }
      responses:
        '200':
          description: Reviewed guidance or a typed UNAVAILABLE result. Never alters the deterministic verdict.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [status, claimId, onlineSearchPerformedByNvidia, verificationChanged, nextSteps]
                properties:
                  status: { type: string, enum: [GUIDANCE_AVAILABLE, UNAVAILABLE] }
                  reasonCode: { type: string }
                  claimId: { type: [string, 'null'] }
                  provider: { type: string, const: NVIDIA_NIM }
                  model: { type: string }
                  onlineSearchPerformedByNvidia: { type: boolean, const: false }
                  verificationChanged: { type: boolean, const: false }
                  assessedVerdict: { type: string, enum: [SUPPORTED, CONTRADICTED, NOT_VERIFIED] }
                  explanation: { type: string }
                  nextSteps:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [id, text]
                      properties:
                        id: { type: string }
                        text: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/Error' }
  /api/genieproof/extract-preview:
    post:
      operationId: previewGenieProofClaims
      tags: [GenieProof]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      description: Authenticated, rate-limited, unsaved user-submitted text parsing. Available without signing keys. Does not retrieve external evidence, verify a financial claim, or create a passport.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenieProofExtractRequest' } } } }
      responses:
        '200':
          description: Non-verified candidate classification only. No source retrieval or storage.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [ok, previewOnly, status, sourceEvidenceChecked, signedPassportCreated, claims, inputHash, extractionVersion, claimsTruncated, omittedClaimCount, requiresCustomerConfirmation, rawOfferRetained]
                properties:
                  ok: { type: boolean, const: true }
                  previewOnly: { type: boolean, const: true }
                  status: { type: string, const: CANDIDATES_ONLY }
                  sourceEvidenceChecked: { type: boolean, const: false }
                  signedPassportCreated: { type: boolean, const: false }
                  claims: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/GenieProofCandidate' } }
                  inputHash: { type: string, pattern: '^[a-f0-9]{64}$' }
                  extractionVersion: { type: string }
                  claimsTruncated: { type: boolean }
                  omittedClaimCount: { type: integer, minimum: 0 }
                  requiresCustomerConfirmation: { type: boolean, const: true }
                  rawOfferRetained: { type: boolean, const: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/Error' }
  /api/genieproof/extract:
    post:
      operationId: extractGenieProofClaims
      tags: [GenieProof]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      description: Local bounded deterministic candidate extraction only. It returns no verdict; the customer must review and confirm every claim. Raw offer text is not persisted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenieProofExtractRequest' } } } }
      responses: { '200': { description: Extracted candidates awaiting customer confirmation, content: { application/json: { schema: { $ref: '#/components/schemas/GenieProofExtraction' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/Error' } }
  /api/genieproof/cases:
    post:
      operationId: createGenieProofPassport
      tags: [GenieProof]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: required
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      description: Creates a private owner-scoped signed passport after rechecking the submitted input hash, confirmed claims, and explicit consent. Cases are limited to 25 per user and expire 90 days after saving; MongoDB TTL cleanup may occur shortly after expiry. Current unqualified source evidence produces NOT_VERIFIABLE. No investment recommendation or monitoring enrollment occurs.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenieProofCreateRequest' } } } }
      responses: { '200': { description: Replayed idempotent creation, content: { application/json: { schema: { $ref: '#/components/schemas/GenieProofCreated' } } } }, '201': { description: Created signed passport, content: { application/json: { schema: { $ref: '#/components/schemas/GenieProofCreated' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '429': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Unavailable' } }
    get:
      operationId: listGenieProofCases
      tags: [GenieProof]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      description: Lists only the authenticated user's saved cases. Query parameters are rejected.
      responses:
        '200':
          description: Owned case summaries.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
