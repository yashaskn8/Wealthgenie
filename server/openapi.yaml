    PostTaxInstrumentFields:
      type: object
      required: [instrumentType, nominalRate, holdingYears, monthlySIP]
      properties:
        instrumentId: { type: string, minLength: 1, maxLength: 128, description: Optional canonical catalog identity used for response correlation; it never authenticates exact issuer-product market or tax data. }
        instrumentType: { type: string, minLength: 1, pattern: '^\s*\S(?:[\s\S]{0,48}\S)?\s*$', description: The server trims whitespace before enforcing a 1 to 50 character limit; the pattern applies that limit to the trimmed value and rejects whitespace-only input. }
        nominalRate: { type: number, minimum: 0, maximum: 1 }
        holdingYears: { type: number, minimum: 0.01, maximum: 100 }
        monthlySIP: { type: number, minimum: 0, maximum: 100000000 }
        acquisitionDate: { type: string, format: date, description: 'If supplied, redemptionDate is also required. The server rejects impossible calendar dates.' }
        redemptionDate: { type: string, format: date, description: 'If supplied, acquisitionDate is also required and redemptionDate cannot precede it. The server rejects impossible calendar dates and reversed transaction chronology.' }
        redemptionChannel: { type: string, enum: [RBI_REDEMPTION, MATURITY_REDEMPTION, SECONDARY_MARKET_SALE] }
        acquiredAtOriginalIssue: { type: boolean }
        heldContinuously: { type: boolean }
        couponRate: { type: number, minimum: 0, maximum: 1 }
        annuityFraction: { type: number, minimum: 0, maximum: 1 }
        retirementTiming: { type: string, pattern: '^\s*\S[\s\S]{0,98}\S\s*$', description: The server trims whitespace before enforcing a 2 to 100 character limit; the pattern applies that limit to the trimmed value and rejects whitespace-only input. }
      x-runtime-validation:
        transactionDates: acquisitionDate and redemptionDate must be supplied together; both must be real calendar dates; redemptionDate must be on or after acquisitionDate.
        trimmedText: instrumentType and retirementTiming are trimmed before the server enforces their length constraints; the OpenAPI patterns allow surrounding whitespace while bounding the post-trim value.
        monetaryPrecision: The server rejects contribution/rate/horizon combinations whose nominal SIP maturity value would exceed safe INR integer precision.
      allOf:
        - if:
            required: [acquisitionDate]
          then:
            required: [redemptionDate]
        - if:
            required: [redemptionDate]
          then:
            required: [acquisitionDate]
