    UserDeclaredPostTaxScenarioRequest:
      type: object
      additionalProperties: false
      required: [canonicalInstrumentId, scenarioType, annualGrossIncome, incomeSource, regime, fiscalYear, userAge]
      properties:
        canonicalInstrumentId: { type: string, enum: [fd, sbi_fd, rbi_bonds, sgb, nifty_etf] }
        scenarioType: { type: string, enum: [INTEREST_INCOME, EQUITY_REALIZED_GAIN] }
        canonicalProductId: { type: string, const: 'etf:isin:INF204KB14I2', description: Required only for the exact qualified NIFTYBEES equity scenario. }
        interestReceived: { type: number, minimum: 0, maximum: 1000000000, description: Gross user-declared interest received during the selected fiscal year. Required for INTEREST_INCOME. }
        acquisitionCostBasis: { type: number, exclusiveMinimum: 0, maximum: 1000000000, description: User-declared tax cost basis. Required for the exact qualified ETF scenario. }
        saleProceeds: { type: number, minimum: 0, maximum: 1000000000, description: User-declared sale consideration. Required for the exact qualified ETF scenario. }
        acquisitionDate: { type: string, format: date, description: Required for EQUITY_REALIZED_GAIN; must be on or before redemptionDate. }
        redemptionDate: { type: string, format: date, description: Required for EQUITY_REALIZED_GAIN; must be on or after acquisitionDate and in the selected fiscal year. }
        section112AExemptionUsed: { type: number, minimum: 0, maximum: 125000 }
        sttConditionAssumedSatisfied: { type: boolean, description: User assumption only; the service does not verify an actual STT event. }
        annualGrossIncome: { type: number, minimum: 0, maximum: 1000000000 }
        incomeSource: { type: string, enum: [salary, pension, family_pension, business, other] }
        regime: { type: string, enum: [new] }
        fiscalYear: { type: string, pattern: '^FY\d{4}-\d{2}$' }
        userAge: { type: integer, minimum: 18, maximum: 120, description: 'Explicit tax age on March 31 of the supplied fiscalYear; never inferred from profile age. If deductions.age is also supplied, the server rejects unequal values.' }
        deductions: { $ref: '#/components/schemas/TaxDeductionInputs' }
      allOf:
        - if:
            properties: { canonicalInstrumentId: { const: nifty_etf } }
            required: [canonicalInstrumentId]
          then:
            required: [canonicalProductId]
          else:
            not: { required: [canonicalProductId] }
        - if:
            properties: { scenarioType: { const: INTEREST_INCOME } }
            required: [scenarioType]
          then:
            required: [interestReceived]
            properties:
              canonicalInstrumentId: { enum: [fd, sbi_fd, rbi_bonds, sgb] }
            not:
              anyOf:
                - { required: [acquisitionCostBasis] }
                - { required: [saleProceeds] }
                - { required: [acquisitionDate] }
                - { required: [redemptionDate] }
                - { required: [section112AExemptionUsed] }
                - { required: [sttConditionAssumedSatisfied] }
        - if:
            properties: { scenarioType: { const: EQUITY_REALIZED_GAIN } }
            required: [scenarioType]
          then:
            required: [canonicalProductId, acquisitionCostBasis, saleProceeds, acquisitionDate, redemptionDate, section112AExemptionUsed, sttConditionAssumedSatisfied]
            properties:
              canonicalInstrumentId: { const: nifty_etf }
              canonicalProductId: { const: 'etf:isin:INF204KB14I2' }
            not: { required: [interestReceived] }
      x-runtime-validation:
        transactionDates: acquisitionDate and redemptionDate must be valid calendar dates in chronological order; the equity scenario requires both dates and redemptionDate must fall within the supplied fiscalYear.
    PostTaxReturnRequest:
      allOf:
        - { $ref: '#/components/schemas/PostTaxInstrumentFields' }
        - type: object
          required: [annualIncome, regime, userAge, incomeSource, fiscalYear]
          properties:
            annualIncome: { type: number, minimum: 0, maximum: 1000000000 }
            regime: { type: string, enum: [new] }
            userAge: { type: integer, minimum: 18, maximum: 120, description: 'Explicit tax age on March 31 of the supplied fiscalYear; never inferred from profile age.' }
            incomeSource: { type: string, enum: [salary, pension, family_pension, business, other] }
            fiscalYear: { type: string, pattern: '^FY\d{4}-\d{2}$' }
      unevaluatedProperties: false
      x-runtime-validation:
        transactionDates: acquisitionDate and redemptionDate must be supplied together; both must be real calendar dates; redemptionDate must be on or after acquisitionDate.
