        section80C: { type: number, minimum: 0, maximum: 150000, description: Legacy input name; eligibility is fiscal-year and regime specific. }
        nps80CCD1B: { type: number, minimum: 0, maximum: 50000, description: 'Legacy input name; eligibility is fiscal-year and regime specific. If section80CCD is also supplied, the server requires both amounts to match.' }
        section80CCD: { type: number, minimum: 0, maximum: 50000, description: 'Legacy alias for nps80CCD1B; if both are supplied, the server rejects unequal amounts.' }
        nps80CCD2: { type: number, minimum: 0, maximum: 100000000 }
        basicSalary: { type: number, minimum: 0, maximum: 1000000000 }
        isGovtEmployee: { type: boolean }
        section80D: { type: number, minimum: 0, maximum: 100000 }
        section80D_self: { type: number, minimum: 0, maximum: 50000 }
        section80D_parents: { type: number, minimum: 0, maximum: 50000 }
        parents_senior: { type: boolean }
        self_senior: { type: boolean }
        hra: { type: number, minimum: 0, maximum: 100000000 }
        homeLoanInterest: { type: number, minimum: 0, maximum: 200000 }
        section80EEA: { type: number, minimum: 0, maximum: 150000 }
        savingsInterest: { type: number, minimum: 0, maximum: 100000000 }
        section80TTA: { type: number, minimum: 0, maximum: 10000 }
        section80TTB: { type: number, minimum: 0, maximum: 50000 }
        age: { type: integer, minimum: 18, maximum: 120, description: 'Tax age on March 31 of the supplied fiscalYear; when top-level userAge is also supplied, both values must match. The server rejects unequal values. Never inferred from profile age.' }
        other: { type: number, minimum: 0, maximum: 0, description: Deprecated compatibility input; only zero is accepted. }
      not:
        anyOf:
          - required: [section80D, section80D_self]
          - required: [section80D, section80D_parents]
      allOf:
        - if:
            properties: { nps80CCD2: { exclusiveMinimum: 0 } }
            required: [nps80CCD2]
          then:
            required: [basicSalary, isGovtEmployee]
        - if:
            properties: { section80D_parents: { exclusiveMinimum: 0 } }
            required: [section80D_parents]
          then:
            required: [parents_senior]
    TaxCalculationContextV2:
      type: object
      additionalProperties: false
      description: Product-only context fields may be supplied without a tax context. If any tax context field (annualGrossIncome, incomeSource, regime, fiscalYear, deductions, or userAge) is supplied, all four core tax fields are required.
      properties:
        fiscalYear: { type: string, pattern: '^FY\d{4}-\d{2}$' }
        incomeSource: { type: string, enum: [salary, pension, family_pension, business, other] }
        annualGrossIncome: { type: number, minimum: 0, maximum: 1000000000 }
        regime: { type: string, enum: [new] }
        userAge: { type: integer, minimum: 18, maximum: 120, description: 'Explicit tax age on March 31 of the supplied fiscalYear; never inferred from profile age. If deductions.age is also supplied, the server rejects unequal values.' }
        deductions: { $ref: '#/components/schemas/TaxDeductionInputs' }
        illustrativePrincipal: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        holdingPeriodMonths: { type: number, minimum: 0, maximum: 1200 }
        acquisitionDate: { type: string, format: date, description: 'Must be supplied together with redemptionDate. The server rejects impossible calendar dates.' }
        redemptionDate: { type: string, format: date, description: 'Must be supplied together with acquisitionDate and cannot precede it. The server rejects impossible calendar dates and reversed transaction chronology.' }
        redemptionChannel: { type: string, enum: [RBI_REDEMPTION, MATURITY_REDEMPTION, SECONDARY_MARKET_SALE] }
        acquiredAtOriginalIssue: { type: boolean }
        heldContinuously: { type: boolean }
        section112AExemptionUsed: { type: number, minimum: 0, maximum: 125000, description: Required as an explicit value, including 0 when none was used, for Section 112A equity calculations; annual taxpayer-wide usage. Omission returns REQUIRES_TAX_INPUTS for equity results. }
        sttConditionAssumedSatisfied: { type: boolean, description: Explicit scenario assumption for an equity-fund transfer; true does not verify an actual transaction. }
      x-runtime-validation:
        transactionDates: acquisitionDate and redemptionDate must be supplied together; both must be real calendar dates; redemptionDate must be on or after acquisitionDate.
      allOf:
        - if:
            anyOf:
              - required: [annualGrossIncome]
              - required: [incomeSource]
              - required: [regime]
              - required: [fiscalYear]
              - required: [deductions]
              - required: [userAge]
          then:
            required: [annualGrossIncome, incomeSource, regime, fiscalYear]
        - if:
            properties: { regime: { const: old } }
            required: [regime]
          then: { required: [userAge] }
        - if:
            required: [acquisitionDate]
          then:
            required: [redemptionDate]
        - if:
            required: [redemptionDate]
          then:
            required: [acquisitionDate]
        - if:
            properties:
              deductions:
                anyOf:
                  - { properties: { section80D: { exclusiveMinimum: 0 } }, required: [section80D] }
                  - { properties: { section80D_self: { exclusiveMinimum: 0 } }, required: [section80D_self] }
                  - { properties: { section80D_parents: { exclusiveMinimum: 0 } }, required: [section80D_parents] }
                  - { properties: { savingsInterest: { exclusiveMinimum: 0 } }, required: [savingsInterest] }
                  - { properties: { section80TTA: { exclusiveMinimum: 0 } }, required: [section80TTA] }
                  - { properties: { section80TTB: { exclusiveMinimum: 0 } }, required: [section80TTB] }
            required: [deductions]
          then: { required: [userAge] }
