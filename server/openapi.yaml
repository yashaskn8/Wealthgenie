                  - { properties: { section80TTA: { exclusiveMinimum: 0 } }, required: [section80TTA] }
                  - { properties: { section80TTB: { exclusiveMinimum: 0 } }, required: [section80TTB] }
            required: [deductions]
          then: { required: [userAge] }
