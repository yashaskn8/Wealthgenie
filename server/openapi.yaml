                description: Legacy total-contributed-principal pre-tax projection CAGR stored as a decimal fraction (for example, 0.07 means 7 percent). It does not account for monthly contribution timing and is preserved for compatibility; use sipReturnMetrics.preTaxAnnualizedReturnPercent for the modeled SIP equivalent annual rate in percent. Null when unavailable.
