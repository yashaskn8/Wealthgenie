apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthgenie-agent-worker
spec:
  template:
    spec:
      containers:
        - name: agent-worker
          env:
            # Must match the API Redis provider and fail if unprovisioned.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: REDIS_URL
            - name: MONGODB_TLS_CA_FILE
              value: /etc/wealthgenie/documentdb/ca.pem
          volumeMounts:
            - name: documentdb-ca
              mountPath: /etc/wealthgenie/documentdb
              readOnly: true
      volumes:
        - name: documentdb-ca
          secret:
            secretName: ${WEALTHGENIE_DOCUMENTDB_CA_SECRET}
            items:
              - key: ca.pem
                path: ca.pem
