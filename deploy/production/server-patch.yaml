apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthgenie-server
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            # The shared Kind/ML default is mock. The production API uses its
            # configured server-side provider and still fails closed without
            # valid provider credentials; this never changes ML inference.
            - name: LLM_DEFAULT_PROVIDER
              value: "api"
            - name: LLM_PRIMARY_PROVIDER
              value: "GROQ"
            # Production Redis endpoint is a required private Secret.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: REDIS_URL
            - name: MONGODB_TLS_CA_FILE
              value: /etc/wealthgenie/documentdb/ca.pem
          volumeMounts:
            - name: documentdb-ca
              mountPath: /etc/wealthgenie/documentdb
              readOnly: true
      volumes:
        - name: documentdb-ca
          secret:
            secretName: ${WEALTHGENIE_DOCUMENTDB_CA_SECRET}
            items:
              - key: ca.pem
                path: ca.pem
