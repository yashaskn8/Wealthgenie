apiVersion: v1
kind: ConfigMap
metadata:
  name: wealthgenie-config
data:
  # Replace the placeholder before rendering/applying this overlay.
  CORS_ORIGINS: "https://${WEALTHGENIE_PRODUCTION_HOST}"
  MONGODB_FLAVOR: "documentdb"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: "strict"
  # A live production Plan Review needs Redis for durable capacity, replay
  # protection, session revocation and the dedicated worker's admission path.
  REQUIRE_REDIS: "true"
  # Gemini may rescue an approved, budgeted Groq transport/server outage only;
  # model gateway never falls back without a durable per-run reservation and
  # never routes around auth, rate-limit, policy or safety failures. Missing
  # Gemini credentials remain unavailable, not a synthetic successful response.
  LLM_GEMINI_FALLBACK_ENABLED: "true"
  # Read-only Plan Review runs through the dedicated external worker.
  # API and worker startup verify required indexes; the release must perform
  # Phase 4/5 migrations and pass worker readiness before receiving traffic.
  AGENTIC_PLAN_REVIEW_ENABLED: "true"
  AGENT_STREAM_ENABLED: "true"
  # Keep the existing market path explicit. Change only after endpoint rights
  # and the selected-mode production configuration have been approved.
  MARKET_DATA_MODE: "LEGACY"
