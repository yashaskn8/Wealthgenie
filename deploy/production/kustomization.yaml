apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wealthgenie

resources:
  - ../../k8s

# Deliberately non-deployable until a release overlay supplies real registry
# digests. The deployment filter rejects these sentinels and all tag refs.
images:
  - name: wealthgenie-server
    newName: registry-required.invalid/wealthgenie-server
    digest: sha256:WEALTHGENIE_SERVER_IMAGE_DIGEST_REQUIRED
  - name: wealthgenie-frontend
    newName: registry-required.invalid/wealthgenie-frontend
    digest: sha256:WEALTHGENIE_FRONTEND_IMAGE_DIGEST_REQUIRED
  - name: wealthgenie-ml-service
    newName: registry-required.invalid/wealthgenie-ml-service
    digest: sha256:WEALTHGENIE_ML_SERVICE_IMAGE_DIGEST_REQUIRED
  - name: redis
    newName: registry-required.invalid/redis
    digest: sha256:WEALTHGENIE_REDIS_IMAGE_DIGEST_REQUIRED

patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: wealthgenie-ingress
  - path: config-patch.yaml
    target:
      version: v1
      kind: ConfigMap
      name: wealthgenie-config
  - path: server-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: wealthgenie-server
  - path: worker-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: wealthgenie-agent-worker
  - path: remove-incluster-mongodb.yaml
