server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser protections must be emitted by the static frontend origin, not
    # only by the separately proxied Express API. React currently uses inline
    # style attributes, so style-src permits inline styles; scripts do not.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The production frontend is built with VITE_API_URL=/api. Keep those
    # requests same-origin and forward the full /api path to Express.
    location /api/ {
        proxy_pass http://wealthgenie-server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep the production edge longer than the 90-second browser deadline
        # while remaining a bounded upstream wait.
        proxy_connect_timeout 10s;
        proxy_send_timeout 125s;
        proxy_read_timeout 125s;
    }

    # React Router history fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
