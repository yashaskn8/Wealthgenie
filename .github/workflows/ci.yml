name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate each main push by its SHA so prior long-running CI cannot block
  # verification of newer main. Still deduplicate stale pull-request runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  household-runway-adversarial:
    name: Household Runway Adversarial Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Start isolated transaction-capable MongoDB 7
        uses: supercharge/mongodb-github-action@b0a1493307c4e9b82ed61f3858d606c5ff190c64 # 1.10.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install audited application dependencies
        run: npm ci --prefix server
      - name: Red-team deterministic amounts, same-day timing and independent numerical oracle
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          node --test server/test/runwayEngine.test.js server/test/runwayOracle.test.js server/test/runwayRoutes.test.js server/test/runwaySeal.test.js server/test/runwayOperationalReadiness.test.js server/test/runwayStatementImport.test.js
      - name: Red-team real Mongo transactions, account boundaries, tampering and concurrency
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/wealthgenie_runway_test?replicaSet=rs0
          NODE_ENV: test
          DISABLE_RATE_LIMIT: 'true'
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export RUNWAY_INTEGRITY_SECRET="$(openssl rand -hex 32)"
          node --test server/test/runwayMongo.integration.test.js

  backend-financial-integrity:
    name: Backend & Financial Integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Start MongoDB 7 replica set
        uses: supercharge/mongodb-github-action@b0a1493307c4e9b82ed61f3858d606c5ff190c64 # 1.10.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Migrate and verify private financial source-retention indexes
        env:
          MONGODB_MIGRATION_URI: mongodb://127.0.0.1:27017/wealthgenie_financial_indexes_test?replicaSet=rs0
        run: npm run finance:mongo:migrate-indexes --prefix server

      - name: Migrate and verify Goals-only budget indexes
        env:
          MONGODB_MIGRATION_URI: mongodb://127.0.0.1:27017/wealthgenie_financial_indexes_test?replicaSet=rs0
        run: npm run goals:migrate-budget-indexes --prefix server

      - name: Migrate Household Runway indexes
        env:
          MONGODB_MIGRATION_URI: mongodb://127.0.0.1:27017/wealthgenie_financial_indexes_test?replicaSet=rs0
        run: npm run runway:migrate-indexes --prefix server

      - name: Run Backend ESLint Check
        run: |
          cd server
          npm run lint

      - name: Run Backend Syntax Check
        run: |
          cd server
          npm run typecheck

      - name: Run Backend Tests & Coverage
        env:
          MONGODB_URI: 'mongodb://127.0.0.1:27017/wealthgenie_test?replicaSet=rs0'
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          node server/scripts/test-partition.js verify
          npm run test:coverage --prefix server

      - name: Upload Backend Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage-linux-node22-mongo7
          path: server/reports/

  finance-postgres-integration:
    name: Financial PostgreSQL Migration & Rights Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690 # exact approved CI image digest
        env:
          POSTGRES_DB: wealthgenie_financial_test
          POSTGRES_USER: wealthgenie_test
          POSTGRES_PASSWORD: ci-only-postgres-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthgenie_test -d wealthgenie_financial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINANCIAL_POSTGRES_URL: postgresql://wealthgenie_test:ci-only-postgres-secret@127.0.0.1:5432/wealthgenie_financial_test
      FINANCIAL_POSTGRES_TEST_MODE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install reproducible server dependencies
        run: npm ci --prefix server
      - name: Red-team product qualification, suitability and migration hashes
        run: node --test server/test/familyTopThree.test.js server/test/threeProductFamilyCatalog.test.js server/test/qualifyFamilyProduct.test.js server/test/financialPostgresReadiness.test.js
      - name: Apply financial-universe schema with migration checksum
        run: npm run finance:pg:migrate --prefix server
      - name: Stage and reconcile canonical 155-entry archetype catalog
        run: npm run finance:pg:seed --prefix server
      - name: Verify actual SQL identity, rights default, revocation, and valuation data
        run: node server/scripts/verifyFinancialPostgresIntegration.js
      - name: Audit all 250 families and report missing real product evidence
        run: npm run finance:top3:audit --prefix server > financial-top3-coverage.json
      - name: Generate 750 empty evidence slots without pretending issuer verification
        run: npm run finance:top3:review-queue --prefix server > financial-top3-review-queue.csv
      - name: Upload 250-family product evidence review queue
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: financial-top3-review-queue
          path: financial-top3-review-queue.csv
          if-no-files-found: warn
      - name: Publish audited family coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: financial-top3-coverage-report
          path: financial-top3-coverage.json
          if-no-files-found: warn

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: reactapp/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd reactapp
          npm ci

      - name: Run ESLint Check
        run: |
          cd reactapp
          npm run lint

      - name: Run TypeScript Check
        run: |
          cd reactapp
          npm run typecheck

      - name: Run Vitest Suite
        run: |
          cd reactapp
          npm test

      - name: Build Production Frontend
        run: |
          cd reactapp
          npm run build

  ai-ml-rag-safety:
    name: AI/ML & RAG Safety
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json
        name: Setup Node.js 22.x
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            ml-service/pyproject.toml
            ml-service/uv.lock
            ml-service/requirements.txt

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          enable-cache: false

      - name: Validate ML dependency lock
        run: node ml-service/scripts/validate_dependency_lock.js

      - name: Install Requirements
        run: |
          cd ml-service
          python -m pip install --require-hashes -r requirements.txt

      - name: Verify qualified serving artifacts
        run: python scripts/verify_serving_artifacts.py
        working-directory: ml-service

      - name: Validate research-paper evidence integrity
        run: |
          python -m unittest discover -s scripts/research -p 'test_*.py' -v
          python scripts/research/validate_paper_evidence.py --output ml-service/reports/paper_readiness_audit.json

      - name: Run Pytest Suite
        run: |
          cd ml-service
          python -m pytest -q

      - name: Cache pinned semantic model
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-wealthgenie-minilm-${{ hashFiles('ml-service/rag/embeddings/dense_embedding.py') }}

      - name: Fetch exact pinned model revision
        working-directory: ml-service
        env:
          HF_HUB_ETAG_TIMEOUT: '30'
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
          HF_HUB_OFFLINE: '0'
          TRANSFORMERS_OFFLINE: '0'
        run: >-
          python -c "from sentence_transformers import SentenceTransformer; from rag.embeddings.dense_embedding import SentenceTransformerEmbeddingProvider as P; SentenceTransformer(P.DEFAULT_MODEL_NAME, revision=P.MODEL_REVISION, trust_remote_code=False)"

      - name: Run semantic-model integration tests offline
        working-directory: ml-service
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest -q -o addopts="-p no:phoenix" -m model_integration
      - name: Reproduce current verified RAG corpus for research evidence
        working-directory: ml-service
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m rag.evaluation.paper_replay --output reports/paper_rag_current.json

      - name: Validate reproducible RAG experiment lineage
        run: >-
          python scripts/research/validate_paper_evidence.py
          --candidate ml-service/reports/paper_rag_current.json
          --output ml-service/reports/paper_readiness_audit.json

      - name: Archive measured paper RAG evidence and outstanding limitations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-rag-evidence
          path: |
            ml-service/reports/paper_rag_current.json
            ml-service/reports/paper_readiness_audit.json
          if-no-files-found: warn
      - name: Verify pinned A2A applicability policy tests
        run: python scripts/test_validate_a2a_tck_policy.py
  integration-security:
    name: Integration & Security
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/wealthgenie_e2e?replicaSet=rs0
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: e2e-only-jwt-secret-with-more-than-32-characters
      ML_SERVICE_URL: http://127.0.0.1:8000
      ML_SERVICE_API_KEY: ''
      ML_OPERATOR_KEY: ''
      ENVIRONMENT: test
      ML_STATE_BACKEND: mongodb
      RAG_EMBEDDING_PROVIDER: tf_idf_dense
      LLM_DEFAULT_PROVIDER: mock
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NODE_ENV: development
      MARKET_DATA_MODE: UPSTOX_ONLY
      UPSTOX_PUBLIC_MARKET_DATA_LICENSE_CONFIRMED: 'false'
      DISABLE_RATE_LIMIT: 'true'
      CORS_ORIGINS: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:5000/api
      VITE_GENIEPROOF_ENABLED: 'true'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Generate isolated ML integration credentials
        run: |
          # Compose starts ML with production-grade secret validation even in CI.
          # Generate distinct ephemeral values shared by host tests and containers.
          echo "ML_SERVICE_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ML_OPERATOR_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            reactapp/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml-service/pyproject.toml
            ml-service/uv.lock
            ml-service/requirements.txt

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          enable-cache: false

      - name: Validate ML dependency lock
        run: node ml-service/scripts/validate_dependency_lock.js

      - name: Install application and browser dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix reactapp
          python -m pip install --require-hashes -r ml-service/requirements.txt
          cd reactapp
          npx playwright install --with-deps chromium

      - name: Validate immutable workflow action references
        run: node server/scripts/validate-workflow-action-pins.js
      - name: Syntax-check standalone worker
        run: node --check server/worker.js
      - name: Validate deployment and security configuration
        run: node server/scripts/validate-deployment-config.js
      - name: Audit backend npm dependencies
        run: npm audit --prefix server --omit=dev --audit-level=low
      - name: Audit frontend npm dependencies
        run: npm audit --prefix reactapp --audit-level=high
      - name: Start MongoDB for the explicit ML/RAG state migration
        run: docker compose up -d mongodb

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Wait for transaction-capable MongoDB primary
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx true; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color mongodb
          exit 1

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Run the explicit Phase 2 persistence migration
        run: >-
          docker compose run --build --rm --no-deps
          -e MONGODB_MIGRATION_URI='mongodb://mongodb:27017/wealthgenie?replicaSet=rs0'
          server npm run migrate:phase2-indexes

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Run the explicit Phase 3 ML/RAG state migration before starting application replicas
        run: docker compose run --build --rm --no-deps ml-service python scripts/migrate_phase3_state.py

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Run the explicit Phase 4 PlanReview persistence migration
        run: >-
          docker compose run --build --rm --no-deps
          -e MONGODB_MIGRATION_URI='mongodb://mongodb:27017/wealthgenie?replicaSet=rs0'
          server npm run migrate:phase4-plan-review-indexes

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Run the explicit Phase 5 durable agent runtime migration
        run: >-
          docker compose run --build --rm --no-deps
          -e MONGODB_MIGRATION_URI='mongodb://mongodb:27017/wealthgenie?replicaSet=rs0'
          server npm run migrate:phase5-agent-runtime

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Run the explicit Phase 7 ResearchAgent task migration
        run: >-
          docker compose run --build --rm --no-deps
          -e MONGODB_MIGRATION_URI='mongodb://mongodb:27017/wealthgenie?replicaSet=rs0'
          server npm run migrate:phase7-research-tasks

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Bootstrap the production-image shared RAG corpus
        run: >-
          docker compose run --build --rm --no-deps
          -e WEALTHGENIE_RAG_BOOTSTRAP=1
          ml-service python scripts/bootstrap_rag_corpus.py

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Verify trusted serving artifacts in the production image
        run: docker compose run --rm --no-deps ml-service python scripts/verify_serving_artifacts.py

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Register verified serving bundles in MongoDB
        run: >-
          docker compose run --rm --no-deps
          -e WEALTHGENIE_PHASE3_BOOTSTRAP=1
          ml-service python scripts/register_trusted_bundles.py

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Start the real Nginx edge stack
        run: docker compose up --build -d

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Wait for backend and published Nginx frontend
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5000/health/ready > /dev/null \
              && curl --fail --silent http://127.0.0.1/ > /dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 120 ]; then
              docker compose ps
              docker compose logs --no-color server reactapp ml-service
              exit 1
            fi
            sleep 3
          done

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Run production-edge Playwright test through Nginx
        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1
        run: npm run test:e2e --prefix reactapp -- production-edge.spec.ts

      - name: Tear down edge stack
        if: always()
        run: docker compose down --volumes --remove-orphans

        env:
          JWT_SECRET: edge-e2e-jwt-secret-with-more-than-32-characters
          CORS_ORIGINS: http://127.0.0.1
          AUTH_COOKIE_SECURE: 'false'
          MONGODB_FLAVOR: mongodb
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Start transaction-capable MongoDB
        uses: supercharge/mongodb-github-action@b0a1493307c4e9b82ed61f3858d606c5ff190c64 # 1.10.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Start Redis for browser and MCP integration
        run: |
          docker compose up -d redis
          for attempt in $(seq 1 30); do
            if docker compose exec -T redis redis-cli ping | grep -qx PONG; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color redis
          exit 1
      - name: Verify Redis-backed MCP rate and lease fencing
        env:
          MCP_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: node server/scripts/testMcpRedisCapacity.js
      - name: Verify isolated browser-test Mongo database ownership
        run: node --test --test-concurrency=1 reactapp/e2e/helpers/isolatedMongoDatabase.test.js

      - name: Migrate Phase 2 persistence indexes
        run: MONGODB_MIGRATION_URI="$MONGODB_URI" npm run migrate:phase2-indexes --prefix server

      - name: Migrate Phase 3 ML/RAG shared-state indexes
        working-directory: ml-service
        run: python scripts/migrate_phase3_state.py

      - name: Migrate Phase 4 PlanReview persistence indexes
        run: MONGODB_MIGRATION_URI="$MONGODB_URI" npm run migrate:phase4-plan-review-indexes --prefix server

      - name: Migrate Phase 5 durable agent runtime persistence
        run: MONGODB_MIGRATION_URI="$MONGODB_URI" npm run migrate:phase5-agent-runtime --prefix server

      - name: Migrate Phase 7 ResearchAgent task persistence
        run: MONGODB_MIGRATION_URI="$MONGODB_URI" npm run migrate:phase7-research-tasks --prefix server

      - name: Bootstrap the shared RAG corpus generation
        working-directory: ml-service
        env:
          WEALTHGENIE_RAG_BOOTSTRAP: "1"
          RAG_EMBEDDING_PROVIDER: tf_idf_dense
        run: python scripts/bootstrap_rag_corpus.py

      - name: Verify transactional ML model activation
        working-directory: ml-service
        env:
          ML_TEST_MONGODB_URI: ${{ env.MONGODB_URI }}
        run: python -m pytest tests/test_mongo_registry_transactions.py -q

      - name: Verify transactional shared RAG lifecycle
        working-directory: ml-service
        env:
          ML_TEST_MONGODB_URI: ${{ env.MONGODB_URI }}
        run: python -m pytest tests/test_mongo_rag_lifecycle_transactions.py -q

      - name: Verify trusted serving artifact bundles
        run: python ml-service/scripts/verify_serving_artifacts.py

      - name: Register verified serving bundles in MongoDB
        working-directory: ml-service
        env:
          WEALTHGENIE_PHASE3_BOOTSTRAP: "1"
        run: python scripts/register_trusted_bundles.py

      - name: Start real application services
        run: |
          cd ml-service
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../ml-service-e2e.log 2>&1 &
          cd ../server
          node server.js > ../server-e2e.log 2>&1 &
          cd ../reactapp
          npm run dev -- --host 127.0.0.1 > ../frontend-e2e.log 2>&1 &

      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/readyz | grep --quiet '"status":"ready"'; then break; fi
            if [ "$attempt" -eq 90 ]; then cat ml-service-e2e.log; exit 1; fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl --fail --silent -H "X-API-Key: $ML_SERVICE_API_KEY" http://127.0.0.1:8000/rag/readyz | grep --quiet '"status":"READY"'; then break; fi
            if [ "$attempt" -eq 60 ]; then cat ml-service-e2e.log; exit 1; fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health/ready > /dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat server-e2e.log; exit 1; fi
            sleep 2
          done
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/login > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat frontend-e2e.log; exit 1; fi
            sleep 2
          done

      - name: Run profile completion integration
        env:
          RUN_PROFILE_COMPLETION_INTEGRATION: 'true'
        working-directory: server
        run: node --test --test-concurrency=1 test/profileCompletion.integration.test.js

      - name: Run real-dependency Playwright lifecycle
        run: npm run test:e2e --prefix reactapp -- --grep-invert @production-edge

      - name: Audit Python dependencies
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --require-hashes -r ml-service/requirements-ci-audit.txt
          python -m pip check
          # Two exact, temporary exceptions with compensating controls:
          # - PYSEC-2026-2447: DiskCache has no fixed release; live GEPA disables
          #   DSPy disk caching before constructing models (test_agent_evolution.py).
          # - CVE-2026-69112: no confirmed fixed Accelerate release; our only
          #   model-loading boundary validates every sharded checkpoint index
          #   before Transformers/Accelerate reads it (test_llm_infrastructure.py).
          # Remove each exception only after an upstream fix and verification.
          pip-audit --ignore-vuln PYSEC-2026-2447 --ignore-vuln CVE-2026-69112

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-real-dependency-failure
          if-no-files-found: ignore
          path: |
            reactapp/test-results/
            ml-service-e2e.log
            server-e2e.log
            frontend-e2e.log

      - name: Tear down browser Redis
        if: always()
        run: docker compose down --volumes --remove-orphans
