name: One-time Python Lock Repair (main only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-python-locks-on-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-verify:
    if: ${{ github.repository == 'yashaskn8/Wealthgenie' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Require patched dependencies, preserving original release families
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ml-service/pyproject.toml')
          s = p.read_text()
          replacements = {
              '"litellm==1.102.0"': '"litellm==1.102.2"',
              '"pymongo>=4.6.0"': '"pymongo>=4.18.3",\n  "dnspython>=2.9.0"',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Unexpected dependency declaration: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Regenerate uv lock and all hash-pinned requirement exports
        run: |
          set -euo pipefail
          cd ml-service
          uv lock --upgrade-package litellm --upgrade-package pymongo --upgrade-package dnspython
          uv export --locked --no-dev --format requirements.txt --emit-index-url --no-annotate --no-header --output-file requirements.txt
          uv export --locked --only-group agent-evolution-tests --format requirements.txt --no-emit-index-url --no-annotate --no-header --output-file requirements-agent-evolution-tests.txt
          uv export --locked --only-group ci-audit-tools --format requirements.txt --no-emit-index-url --no-annotate --no-header --output-file requirements-ci-audit.txt
          cd ..
          node ml-service/scripts/validate_dependency_lock.js
      - name: Verify exact hashes, dependency compatibility and real security audit
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r ml-service/requirements.txt
          python -m pip install --require-hashes -r ml-service/requirements-ci-audit.txt
          python -m pip check
          pip-audit --ignore-vuln PYSEC-2026-2447 --ignore-vuln CVE-2026-69112
      - name: Publish verified source files in job log for review (not a GitHub push)
        run: |
          set -euo pipefail
          for file in ml-service/pyproject.toml ml-service/uv.lock ml-service/requirements.txt ml-service/requirements-agent-evolution-tests.txt ml-service/requirements-ci-audit.txt; do
            printf 'WG_BEGIN_FILE::%s\n' "$file"
            base64 -w 3000 "$file" | sed 's/^/WG_FILE_DATA::/'
            printf 'WG_END_FILE::%s\n' "$file"
          done
          printf 'WG_LOCK_REPAIR_VALIDATED\n'
