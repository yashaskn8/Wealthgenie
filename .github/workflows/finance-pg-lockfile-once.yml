name: Resolve Financial PostgreSQL Lockfile
on:
  push:
    branches:
      - feature/financial-architecture-unified-20261022
    paths:
      - .github/workflows/finance-pg-lockfile-once.yml
permissions:
  contents: write
jobs:
  resolve-pg-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/financial-architecture-unified-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned maintained PostgreSQL client and lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --save-exact pg@8.16.3 --no-audit --no-fund
      - name: Check lockfile and commit to feature branch only
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(finance): install pinned PostgreSQL driver with reproducible npm lock"
          git push origin HEAD:feature/financial-architecture-unified-20261022
