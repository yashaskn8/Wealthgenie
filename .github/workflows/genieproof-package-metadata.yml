name: GenieProof dependency metadata (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/genieproof-package-metadata.yml
jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect patched npm packages
        run: |
          set -euo pipefail
          for package in vitest @vitest/expect @vitest/mocker @vitest/pretty-format @vitest/runner @vitest/snapshot @vitest/spy @vitest/utils; do
            echo "PACKAGE=$package@4.1.12"
            npm view "$package@4.1.12" dist.integrity dependencies --json
          done
          echo "PACKAGE=dompurify@3.4.17"
          npm view dompurify@3.4.17 dist.integrity dependencies --json
