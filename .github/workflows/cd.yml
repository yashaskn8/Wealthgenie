name: Continuous Deployment & Cluster Verification

on:
  # Only a successful CI push on main is eligible for automatic Kind verification.
  # Pull-request CI, stale commits, and failures cannot trigger deployment.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_market_preflight:
        description: Run the strict live-market Phase 15 browser preflight against the deployed Kind cluster
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: cd-kind-deployment
  cancel-in-progress: false

jobs:
  release-quality-gate:
    name: Verify Same-Commit Production Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Require current main and three successful push workflows
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          SOURCE_IS_TRUSTED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          if [ "$SOURCE_IS_TRUSTED" != 'true' ] || [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Release gate: untrusted or non-main invocation; refusing deployment.'
            exit 0
          fi
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$VERIFIED_SHA" != "$latest_sha" ]; then
            echo 'Release gate: this commit was superseded on main.'
            exit 0
          fi
          # CI is the only automatic entrypoint. Wait for the other two
          # required push checks on the exact same main commit to finish.
          # Never treat an absent, failed or timed-out check as a deployment success.
          for attempt in $(seq 1 90); do
            missing=0
            for workflow in ci.yml genievoice-quality.yml coverage-firewall-ci.yml; do
              conclusion="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f head_sha="$VERIFIED_SHA" -f event=push -f per_page=10 \
                --jq '.workflow_runs | sort_by(.created_at) | last | .conclusion // "pending"')"
              case "$conclusion" in
                success) ;;
                pending)
                  echo "Release gate: waiting for $workflow on $VERIFIED_SHA."
                  missing=1
                  ;;
                *)
                  echo "::error::Release gate: $workflow is $conclusion on $VERIFIED_SHA; refusing deployment."
                  exit 1
                  ;;
              esac
            done
            if [ "$missing" -eq 0 ]; then
              latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
              if [ "$VERIFIED_SHA" != "$latest_sha" ]; then
                echo 'Release gate: this commit was superseded on main while waiting.'
                exit 0
              fi
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo 'Release gate passed: CI, GenieVoice and Coverage Firewall succeeded at current main SHA.'
              exit 0
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "::error::Release gate: timed out waiting for all same-commit main checks."
              exit 1
            fi
            sleep 10
          done

  deploy-and-verify-kind:
    name: Local Kind Cluster Deployment & Smoke Verification
    needs: release-quality-gate
    if: ${{ needs.release-quality-gate.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Keep checkout and all $GITHUB_SHA-derived image/provenance identities aligned.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          enable-cache: false

      - name: Validate ML dependency lock before image builds
        run: node ml-service/scripts/validate_dependency_lock.js

      - name: Install production manifest validator dependencies
        run: npm ci --prefix server

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.5

      - name: Validate Terraform IaC
        run: |
          set -euo pipefail
          echo "### Terraform IaC Validation" >> $GITHUB_STEP_SUMMARY
          TERRAFORM_VALIDATION_DIR="$(mktemp -d)"
          trap 'rm -rf "$TERRAFORM_VALIDATION_DIR"' EXIT
          cp -a terraform/. "$TERRAFORM_VALIDATION_DIR/"
          terraform -chdir="$TERRAFORM_VALIDATION_DIR" init -backend=false
          terraform -chdir="$TERRAFORM_VALIDATION_DIR" init -backend=false -lockfile=readonly
          terraform -chdir="$TERRAFORM_VALIDATION_DIR" validate
          echo "Terraform configuration is syntactically valid and modularly sound." >> $GITHUB_STEP_SUMMARY

      - name: Create Kind Kubernetes Cluster
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          cluster_name: kind
          version: v0.32.0
          node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          wait: 120s

      - name: Render and validate fail-closed production image template
        run: |
          set -euo pipefail
          mkdir -p build
          kubectl kustomize deploy/production > build/production-template.yaml
          node server/scripts/validateProductionImageManifest.js --template < build/production-template.yaml > /dev/null

      - name: Install Metrics Server for HPA
        run: |
          set -euo pipefail
          echo "Installing Metrics Server on Kind cluster..."
          # Metrics Server v0.9.x requires Kubernetes v1.34+; the node image is pinned above.
          manifest="$RUNNER_TEMP/metrics-server-components.yaml"
          curl --fail --location --retry 3 --output "$manifest" \
            https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          printf '%s  %s\n' \
            '1cec29a5267809306a2c6ec74a3e449abbb705b4a8beed0c8a1963910f72c79b' \
            "$manifest" | sha256sum --check --status
          kubectl apply -f "$manifest"
          kubectl patch deployment metrics-server -n kube-system --type 'json' -p '[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
          kubectl rollout status deployment metrics-server -n kube-system --timeout=120s

      - name: Build Docker Container Images
        id: build
        run: |
          set -euo pipefail
          IMAGE_TAG="$GITHUB_SHA"
          echo "Building wealthgenie-server image..."
          docker build --build-arg APP_BUILD_SHA="$GITHUB_SHA" -f server/Dockerfile \
            -t "wealthgenie-server:$IMAGE_TAG" -t wealthgenie-server:latest .

          echo "Building wealthgenie-ml-service image..."
          docker build -f ml-service/Dockerfile -t "wealthgenie-ml-service:$IMAGE_TAG" \
            -t wealthgenie-ml-service:latest ml-service/

          echo "Building wealthgenie-frontend image..."
          docker build --build-arg VITE_API_URL=/api \
            --build-arg VITE_BUILD_SHA="$GITHUB_SHA" \
            -f reactapp/Dockerfile \
            -t "wealthgenie-frontend:$IMAGE_TAG" \
            -t wealthgenie-frontend:latest \
            .

          SERVER_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "wealthgenie-server:$IMAGE_TAG")
          FRONTEND_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "wealthgenie-frontend:$IMAGE_TAG")
          ML_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "wealthgenie-ml-service:$IMAGE_TAG")
          FRONTEND_CONTAINER=$(docker create "wealthgenie-frontend:$IMAGE_TAG")
          mkdir -p build/frontend-artifacts
          docker cp "$FRONTEND_CONTAINER:/usr/share/nginx/html/." build/frontend-artifacts/
          docker rm "$FRONTEND_CONTAINER"
          BUILD_GIT_COMMIT_SHA="$GITHUB_SHA" \
          BUILD_GIT_TREE_SHA="$(git rev-parse 'HEAD^{tree}')" \
          BUILD_SERVER_IMAGE_ID="$SERVER_IMAGE_ID" \
          BUILD_FRONTEND_IMAGE_ID="$FRONTEND_IMAGE_ID" \
          BUILD_ML_IMAGE_ID="$ML_IMAGE_ID" \
          BUILD_WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          BUILD_WORKFLOW_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
          BUILD_FRONTEND_ARTIFACT_DIRECTORY="$GITHUB_WORKSPACE/build/frontend-artifacts" \
          BUILD_PROVENANCE_OUTPUT="$GITHUB_WORKSPACE/build/provenance.json" \
            node server/scripts/createBuildProvenance.js
          node -e 'const p = require("./build/provenance.json"); for (const [name, value] of Object.entries({provenance_sha256:p.provenanceSha256, frontend_artifact_set_sha256:p.frontendArtifactSetSha256, git_tree_sha:p.gitTreeSha, server_image_id:p.serverImageIdentity, frontend_image_id:p.frontendImageIdentity, ml_image_id:p.mlImageIdentity})) console.log(`${name}=${value}`)' >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '### Immutable build identities'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Tree: `%s`\n' "$(git rev-parse 'HEAD^{tree}')"
            printf -- '- Provenance SHA-256: `%s`\n' "$(node -p 'require("./build/provenance.json").provenanceSha256')"
            printf -- '- Frontend artifact set SHA-256: `%s`\n' "$(node -p 'require("./build/provenance.json").frontendArtifactSetSha256')"
            printf -- '- Docker image IDs: server `%s`, frontend `%s`, ML `%s`\n' "$SERVER_IMAGE_ID" "$FRONTEND_IMAGE_ID" "$ML_IMAGE_ID"
            printf '%s\n' '- Docker image IDs are local image identities; no registry digest is asserted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Load Images into Kind Cluster
        run: |
          set -euo pipefail
          IMAGE_TAG="$GITHUB_SHA"
          echo "Loading container images into Kind cluster nodes..."
          kind load docker-image "wealthgenie-server:$IMAGE_TAG" --name kind
          kind load docker-image "wealthgenie-ml-service:$IMAGE_TAG" --name kind
          kind load docker-image "wealthgenie-frontend:$IMAGE_TAG" --name kind

      - name: Apply database prerequisites
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create configmap wealthgenie-build-provenance -n wealthgenie \
            --from-file=provenance.json=build/provenance.json \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply \
            -f k8s/configmap.yaml \
            -f k8s/mongodb/pvc.yaml \
            -f k8s/mongodb/statefulset.yaml \
            -f k8s/mongodb/service.yaml \
            -f k8s/redis/deployment.yaml \
            -f k8s/redis/service.yaml

      - name: Inject ephemeral secrets for Kind validation cluster
        run: |
          EPHEMERAL_JWT=$(openssl rand -hex 32)
          EPHEMERAL_ML_KEY=$(openssl rand -hex 32)
          EPHEMERAL_ML_OPERATOR_KEY=$(openssl rand -hex 32)
          EPHEMERAL_METRICS_TOKEN=$(openssl rand -hex 32)
          EPHEMERAL_REDIS_PASSWORD=$(openssl rand -hex 32)
          kubectl create secret generic wealthgenie-secrets -n wealthgenie \
            --from-literal=JWT_SECRET="$EPHEMERAL_JWT" \
            --from-literal=GEMINI_API_KEY="ci-mock-gemini-key" \
            --from-literal=ML_SERVICE_API_KEY="$EPHEMERAL_ML_KEY" \
            --from-literal=ML_OPERATOR_KEY="$EPHEMERAL_ML_OPERATOR_KEY" \
            --from-literal=METRICS_TOKEN="$EPHEMERAL_METRICS_TOKEN" \
            --from-literal=REDIS_PASSWORD="$EPHEMERAL_REDIS_PASSWORD" \
            --from-literal=MONGODB_URI="mongodb://wealthgenie-mongodb.wealthgenie.svc.cluster.local:27017/wealthgenie-ci-demo?replicaSet=rs0" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Wait for Database and Redis to be Ready
        run: |
          echo "Waiting for MongoDB StatefulSet to be Ready..."
          kubectl rollout status statefulset/wealthgenie-mongodb -n wealthgenie --timeout=240s

          echo "Waiting for Redis Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-redis -n wealthgenie --timeout=240s

      - name: Provision isolated Phase 15 demo database sentinel
        id: phase15-database
        run: |
          set -euo pipefail
          DEMO_DATABASE='wealthgenie-ci-demo'
          DEMO_MONGO_HOST='wealthgenie-mongodb.wealthgenie.svc.cluster.local'
          DEMO_MONGO_PORT='27017'
          DEMO_ENVIRONMENT_ID=$(node -e "process.stdout.write(require('node:crypto').randomUUID())")
          if ! [[ "$DEMO_ENVIRONMENT_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]; then
            echo "ERROR: generated environment identity is not UUIDv4"
            exit 1
          fi
          MONGO_POD=$(kubectl get pods -n wealthgenie -l app=wealthgenie-mongodb -o jsonpath='{.items[0].metadata.name}')
          if [[ -z "$MONGO_POD" ]]; then
            echo "ERROR: isolated MongoDB pod was not found"
            exit 1
          fi

          kubectl exec "$MONGO_POD" -n wealthgenie -- mongosh --quiet \
            "mongodb://$DEMO_MONGO_HOST:$DEMO_MONGO_PORT/admin?replicaSet=rs0" \
            --eval "
              const adminDb = db.getSiblingDB('admin');
              const hello = adminDb.runCommand({hello: 1});
              if (hello.setName !== 'rs0' || hello.isWritablePrimary !== true || hello.me !== '$DEMO_MONGO_HOST:$DEMO_MONGO_PORT') {
                throw new Error('Mongo replica-set identity or primary is not the expected in-cluster member');
              }
              const existing = adminDb.adminCommand({listDatabases: 1, nameOnly: true}).databases || [];
              if (existing.some(item => item.name === '$DEMO_DATABASE')) {
                throw new Error('dedicated CI demo database already exists; refusing to reuse prior data');
              }
              const demoDb = db.getSiblingDB('$DEMO_DATABASE');
              if (demoDb.getCollectionNames().length !== 0) {
                throw new Error('dedicated CI demo database is not empty; refusing to reuse prior data');
              }
              demoDb.demo_environment_sentinels.insertOne({
                _id: 'wealthgenie-phase15-demo',
                environmentId: '$DEMO_ENVIRONMENT_ID',
                purpose: 'WEALTHGENIE_PHASE15_DEMO',
                schemaVersion: 1
              });
              const sentinel = demoDb.demo_environment_sentinels.findOne({_id: 'wealthgenie-phase15-demo'});
              if (!sentinel || Object.keys(sentinel).sort().join(',') !== '_id,environmentId,purpose,schemaVersion'
                  || sentinel.environmentId !== '$DEMO_ENVIRONMENT_ID'
                  || sentinel.purpose !== 'WEALTHGENIE_PHASE15_DEMO' || sentinel.schemaVersion !== 1) {
                throw new Error('inserted sentinel does not match the application verification schema');
              }
              print('Verified fresh demo database, rs0 primary, exact Mongo member, and Phase 15 sentinel.');
            "
          {
            echo "database=$DEMO_DATABASE"
            echo "mongo_host=$DEMO_MONGO_HOST"
            echo "mongo_port=$DEMO_MONGO_PORT"
            echo "environment_id=$DEMO_ENVIRONMENT_ID"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Isolated Phase 15 demo database'
            echo '- Database: `wealthgenie-ci-demo` (fresh and empty before sentinel creation)'
            echo '- MongoDB: in-cluster `rs0` primary; exact member and port verified'
            echo '- Environment sentinel: schema validated before application migrations or user registration'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the one-shot Phase 2 index migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase2-index-migration/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Run the one-shot Phase 3 ML/RAG state migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase3-state-migration/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Run the one-shot Phase 4 PlanReview persistence migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase4-plan-review-migration/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Run the one-shot Phase 5 durable agent runtime migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase5-agent-runtime-migration/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Run the one-shot Phase 7 ResearchAgent task migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase7-research-task-migration.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for ResearchAgent task migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Bootstrap and verify the shared RAG corpus generation
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase3-rag-bootstrap/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for RAG corpus bootstrap Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=900s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Bootstrap trusted Phase 3 serving bundles
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase3-serving-bootstrap/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for serving-bundle bootstrap Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=360s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Apply application manifests after database migrations
        run: |
          set -euo pipefail
          mkdir -p build
          kubectl kustomize k8s/ \
            | sed -E "s/(wealthgenie-(server|frontend|ml-service)):latest/\1:${GITHUB_SHA}/g" \
            > build/k8s-pinned.yaml
          kubectl apply -f build/k8s-pinned.yaml

      - name: Create and trust ephemeral Phase 15 loopback TLS identity
        id: phase15-tls
        run: |
          set -euo pipefail
          umask 077
          CERT_DIR="$RUNNER_TEMP/wealthgenie-phase15-tls"
          mkdir -p "$CERT_DIR"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$CERT_DIR/ca.key"
          openssl req -x509 -new -sha256 -days 1 -key "$CERT_DIR/ca.key" \
            -out "$CERT_DIR/ca.crt" -subj '/CN=WealthGenie Phase 15 CI Loopback CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -addext 'subjectKeyIdentifier=hash'
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$CERT_DIR/server.key"
          openssl req -new -sha256 -key "$CERT_DIR/server.key" -out "$CERT_DIR/server.csr" \
            -subj '/CN=127.0.0.1'
          cat > "$CERT_DIR/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=IP:127.0.0.1
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid,issuer
          EOF
          openssl x509 -req -sha256 -days 1 -in "$CERT_DIR/server.csr" \
            -CA "$CERT_DIR/ca.crt" -CAkey "$CERT_DIR/ca.key" -CAcreateserial \
            -out "$CERT_DIR/server.crt" -extfile "$CERT_DIR/server.ext"
          openssl verify -CAfile "$CERT_DIR/ca.crt" "$CERT_DIR/server.crt"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
          NSS_DB="$HOME/.pki/nssdb"
          mkdir -p "$NSS_DB"
          if ! certutil -L -d "sql:$NSS_DB" > /dev/null 2>&1; then
            certutil -N --empty-password -d "sql:$NSS_DB"
          fi
          certutil -A -d "sql:$NSS_DB" -n wealthgenie-phase15-ci -t 'C,,' -i "$CERT_DIR/ca.crt"
          certutil -L -d "sql:$NSS_DB" -n wealthgenie-phase15-ci
          certutil -A -d "sql:$NSS_DB" -n wealthgenie-phase15-ci-server -t ',,' -i "$CERT_DIR/server.crt"
          certutil -V -d "sql:$NSS_DB" -n wealthgenie-phase15-ci-server -u V
          sudo install -m 0644 "$CERT_DIR/ca.crt" /usr/local/share/ca-certificates/wealthgenie-phase15-ci.crt
          sudo update-ca-certificates
          {
            echo "cert_path=$CERT_DIR/server.crt"
            echo "key_path=$CERT_DIR/server.key"
            echo "ca_path=$CERT_DIR/ca.crt"
            echo 'origin=https://127.0.0.1:8443'
          } >> "$GITHUB_OUTPUT"

      - name: Bind server to the verified Phase 15 demo database identity
        env:
          DEMO_DATABASE: ${{ steps.phase15-database.outputs.database }}
          DEMO_MONGO_HOST: ${{ steps.phase15-database.outputs.mongo_host }}
          DEMO_MONGO_PORT: ${{ steps.phase15-database.outputs.mongo_port }}
          DEMO_ENVIRONMENT_ID: ${{ steps.phase15-database.outputs.environment_id }}
          DEMO_BROWSER_ORIGIN: ${{ steps.phase15-tls.outputs.origin }}
        run: |
          set -euo pipefail
          test "$DEMO_DATABASE" = 'wealthgenie-ci-demo'
          test "$DEMO_MONGO_HOST" = 'wealthgenie-mongodb.wealthgenie.svc.cluster.local'
          test "$DEMO_MONGO_PORT" = '27017'
          test "$DEMO_BROWSER_ORIGIN" = 'https://127.0.0.1:8443'
          kubectl set env deployment/wealthgenie-server -n wealthgenie \
            "DEMO_EXPECTED_MONGODB_DATABASE=$DEMO_DATABASE" \
            "DEMO_EXPECTED_MONGODB_HOST=$DEMO_MONGO_HOST" \
            "DEMO_EXPECTED_MONGODB_PORT=$DEMO_MONGO_PORT" \
            "DEMO_EXPECTED_MONGODB_ENVIRONMENT_ID=$DEMO_ENVIRONMENT_ID" \
            "CORS_ORIGINS=$DEMO_BROWSER_ORIGIN"

      - name: Wait for Microservices to be Ready
        run: |
          echo "Waiting for ML Service Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-ml-service -n wealthgenie --timeout=360s || {
            echo "--- ML Service Pod Describe ---"
            kubectl describe pods -n wealthgenie -l app=wealthgenie-ml-service
            echo "--- ML Service Pod Logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-ml-service --tail=80
            exit 1
          }
          ML_POD=$(kubectl get pods -n wealthgenie -l app=wealthgenie-ml-service -o jsonpath='{.items[0].metadata.name}')
          kubectl exec "$ML_POD" -n wealthgenie -- python -c "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/rag/readyz',headers={'X-API-Key':os.environ['ML_SERVICE_API_KEY']}); print(urllib.request.urlopen(req,timeout=10).read().decode())"

          echo "Waiting for external agent worker Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-agent-worker -n wealthgenie --timeout=300s || {
            echo "--- Agent Worker Pod Describe ---"
            kubectl describe pods -n wealthgenie -l app=wealthgenie-agent-worker
            echo "--- Agent Worker Pod Logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-agent-worker --tail=80
            exit 1
          }

          echo "Waiting for Express Server Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-server -n wealthgenie --timeout=300s || {
            echo "--- Server Pod Describe ---"
            kubectl describe pods -n wealthgenie -l app=wealthgenie-server
            echo "--- Server Pod Logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-server --tail=80
            exit 1
          }

          echo "Waiting for Frontend Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-frontend -n wealthgenie --timeout=180s || {
            echo "--- Frontend Pod Describe ---"
            kubectl describe pods -n wealthgenie -l app=wealthgenie-frontend
            echo "--- Frontend Pod Logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-frontend --tail=80
            exit 1
          }

      - name: Verify Cluster State
        env:
          EXPECTED_SERVER_IMAGE_ID: ${{ steps.build.outputs.server_image_id }}
          EXPECTED_FRONTEND_IMAGE_ID: ${{ steps.build.outputs.frontend_image_id }}
          EXPECTED_ML_IMAGE_ID: ${{ steps.build.outputs.ml_image_id }}
        run: |
          set -euo pipefail
          for deployment in wealthgenie-server wealthgenie-agent-worker wealthgenie-frontend wealthgenie-ml-service; do
            actual_image=$(kubectl get deployment "$deployment" -n wealthgenie -o jsonpath='{.spec.template.spec.containers[0].image}')
            expected_image="${deployment/wealthgenie-agent-worker/wealthgenie-server}:$GITHUB_SHA"
            if [[ "$actual_image" != "$expected_image" ]]; then
              echo "ERROR: $deployment is not pinned to this workflow's immutable commit tag: $actual_image"
              exit 1
            fi
          done

          verify_deployed_image_identity() {
            local workload="$1"
            local image_ref="$2"
            local expected_image_id="$3"
            local kind_node
            local image_info
            local runtime_image_id
            local allowed_image_ids
            kind_node=$(kind get nodes --name kind | head -n 1)
            if [[ -z "$kind_node" ]]; then
              echo "ERROR: Kind node is unavailable while verifying $workload image identity"
              exit 1
            fi
            image_info=$(docker exec "$kind_node" crictl inspecti "$image_ref")
            runtime_image_id=$(jq -r '.status.id // empty' <<< "$image_info")
            if [[ "$runtime_image_id" != "$expected_image_id" ]]; then
              echo "ERROR: Kind runtime image identity for $image_ref differs from the Docker image ID recorded at build time"
              echo "Expected: $expected_image_id"
              echo "Runtime:  $runtime_image_id"
              exit 1
            fi
            allowed_image_ids=$(jq -c '[.status.id, (.status.repoDigests[]?)] | map(select(type == "string") | split("@")[-1]) | unique' <<< "$image_info")
            if ! kubectl get pods -n wealthgenie -l "app=$workload" -o json \
              | jq -e --argjson allowed "$allowed_image_ids" '
                [.items[] | .status.containerStatuses[]?.imageID
                  | sub("^.*://"; "") | split("@")[-1]] as $imageIds
                | ($imageIds | length) > 0
                  and all($imageIds[]; . as $imageId | ($allowed | index($imageId)) != null)
              ' > /dev/null; then
              echo "ERROR: running $workload pods do not report an image identity for the exact Kind image built by this workflow: $expected_image_id"
              kubectl get pods -n wealthgenie -l "app=$workload" -o json \
                | jq -r '[.items[] | {name:.metadata.name, imageIds:[.status.containerStatuses[]?.imageID]}]'
              exit 1
            fi
            echo "Verified runtime image identity for $workload: $expected_image_id"
          }

          verify_deployed_image_identity wealthgenie-server "wealthgenie-server:$GITHUB_SHA" "$EXPECTED_SERVER_IMAGE_ID"
          verify_deployed_image_identity wealthgenie-agent-worker "wealthgenie-server:$GITHUB_SHA" "$EXPECTED_SERVER_IMAGE_ID"
          verify_deployed_image_identity wealthgenie-frontend "wealthgenie-frontend:$GITHUB_SHA" "$EXPECTED_FRONTEND_IMAGE_ID"
          verify_deployed_image_identity wealthgenie-ml-service "wealthgenie-ml-service:$GITHUB_SHA" "$EXPECTED_ML_IMAGE_ID"
          echo "### Kubernetes Pod & Service Status" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl get all,pvc,hpa,ingress -n wealthgenie >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n wealthgenie -o wide

      - name: Execute Live Smoke Tests & Prove Request Flow (Step 2)
        env:
          EXPECTED_PROVENANCE_SHA256: ${{ steps.build.outputs.provenance_sha256 }}
          EXPECTED_FRONTEND_ARTIFACT_SHA256: ${{ steps.build.outputs.frontend_artifact_set_sha256 }}
          EXPECTED_GIT_TREE_SHA: ${{ steps.build.outputs.git_tree_sha }}
          EXPECTED_SERVER_IMAGE_ID: ${{ steps.build.outputs.server_image_id }}
          EXPECTED_FRONTEND_IMAGE_ID: ${{ steps.build.outputs.frontend_image_id }}
          EXPECTED_ML_IMAGE_ID: ${{ steps.build.outputs.ml_image_id }}
          DEMO_DATABASE: ${{ steps.phase15-database.outputs.database }}
          DEMO_MONGO_HOST: ${{ steps.phase15-database.outputs.mongo_host }}
          DEMO_MONGO_PORT: ${{ steps.phase15-database.outputs.mongo_port }}
          DEMO_ENVIRONMENT_ID: ${{ steps.phase15-database.outputs.environment_id }}
        run: |
          set -euo pipefail
          echo "### Live Endpoint Smoke Test Verification (Step 2)" >> $GITHUB_STEP_SUMMARY

          echo "Starting scoped port-forward from Service to runner localhost:5000..."
          kubectl port-forward --address=127.0.0.1 -n wealthgenie svc/wealthgenie-server 5000:5000 > port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          kubectl port-forward --address=127.0.0.1 -n wealthgenie svc/wealthgenie-frontend 8080:80 > frontend-port-forward.log 2>&1 &
          FRONTEND_PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" "$FRONTEND_PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          print_server_diagnostics() {
            echo "--- port-forward log ---"
            cat port-forward.log || true
            echo "--- server pods ---"
            kubectl get pods -n wealthgenie -l app=wealthgenie-server -o wide || true
            echo "--- server endpoints ---"
            kubectl get endpoints -n wealthgenie wealthgenie-server -o yaml || true
            echo "--- recent server logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-server --tail=100 || true
          }

          wait_for_http_2xx() {
            local url="$1"
            local attempts="$2"
            local delay_seconds="$3"
            local response_file
            local status
            response_file=$(mktemp)
            for attempt in $(seq 1 "$attempts"); do
              status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output "$response_file" --write-out '%{http_code}' "$url" || true)
              if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                cat "$response_file"
                rm -f "$response_file"
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay_seconds"
              fi
            done
            echo "ERROR: $url did not return a successful response after $attempts attempts (last status: $status)"
            cat "$response_file" || true
            rm -f "$response_file"
            return 1
          }

          if ! wait_for_http_2xx http://127.0.0.1:5000/health/live 30 2 > /dev/null; then
            print_server_diagnostics
            exit 1
          fi

          echo "1. Testing /health/live..."
          LIVE_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 10 http://127.0.0.1:5000/health/live)
          if ! jq -e --arg expected "$GITHUB_SHA" '.buildSha == $expected' <<< "$LIVE_RES" > /dev/null; then
            echo "ERROR: live server build identity does not match the workflow SHA"
            print_server_diagnostics
            exit 1
          fi
          if ! jq -e \
            --arg commit "$GITHUB_SHA" \
            --arg tree "$EXPECTED_GIT_TREE_SHA" \
            --arg provenance "$EXPECTED_PROVENANCE_SHA256" \
            --arg artifacts "$EXPECTED_FRONTEND_ARTIFACT_SHA256" \
            --arg server "$EXPECTED_SERVER_IMAGE_ID" \
            --arg frontend "$EXPECTED_FRONTEND_IMAGE_ID" \
            --arg ml "$EXPECTED_ML_IMAGE_ID" \
            '.buildProvenance.status == "VERIFIED" and .buildProvenance.gitCommitSha == $commit and .buildProvenance.gitTreeSha == $tree and .buildProvenance.provenanceSha256 == $provenance and .buildProvenance.frontendArtifactSetSha256 == $artifacts and .buildProvenance.serverImageIdentity == $server and .buildProvenance.frontendImageIdentity == $frontend and .buildProvenance.mlImageIdentity == $ml' \
            <<< "$LIVE_RES" > /dev/null; then
            echo "ERROR: backend health did not return the expected verified artifact provenance"
            print_server_diagnostics
            exit 1
          fi
          echo "Live Response: $LIVE_RES"
          echo "- **Liveness Probe (/health/live)**: \`$LIVE_RES\`" >> $GITHUB_STEP_SUMMARY

          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 5 --max-time 10 http://127.0.0.1:8080/build-provenance/provenance.json > build/frontend-provenance.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ERROR: frontend provenance endpoint did not become available"
              cat frontend-port-forward.log || true
              exit 1
            fi
            sleep 2
          done
          if ! jq -e \
            --arg commit "$GITHUB_SHA" \
            --arg tree "$EXPECTED_GIT_TREE_SHA" \
            --arg provenance "$EXPECTED_PROVENANCE_SHA256" \
            --arg artifacts "$EXPECTED_FRONTEND_ARTIFACT_SHA256" \
            --arg server "$EXPECTED_SERVER_IMAGE_ID" \
            --arg frontend "$EXPECTED_FRONTEND_IMAGE_ID" \
            --arg ml "$EXPECTED_ML_IMAGE_ID" \
            '.gitCommitSha == $commit and .gitTreeSha == $tree and .provenanceSha256 == $provenance and .frontendArtifactSetSha256 == $artifacts and .serverImageIdentity == $server and .frontendImageIdentity == $frontend and .mlImageIdentity == $ml' \
            build/frontend-provenance.json > /dev/null; then
            echo "ERROR: served frontend and backend do not share the expected provenance manifest"
            exit 1
          fi
          echo "- **Shared build provenance**: backend and frontend both match \`$EXPECTED_PROVENANCE_SHA256\`" >> $GITHUB_STEP_SUMMARY

          echo "2. Testing /health/ready..."
          if ! wait_for_http_2xx http://127.0.0.1:5000/health/ready 30 2 > /dev/null; then
            print_server_diagnostics
            exit 1
          fi
          READY_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 10 http://127.0.0.1:5000/health/ready)
          echo "Ready Response: $READY_RES"
          echo "- **Readiness Probe (/health/ready)**: \`$READY_RES\`" >> $GITHUB_STEP_SUMMARY

          echo "3. Testing /health/deep (with bounded dependency readiness retry)..."
          if ! wait_for_http_2xx http://127.0.0.1:5000/health/deep 30 2 > /dev/null; then
            print_server_diagnostics
            exit 1
          fi
          DEEP_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 10 http://127.0.0.1:5000/health/deep)
          echo "Deep Response: $DEEP_RES"
          echo "- **Deep Health Probe (/health/deep)**: \`$DEEP_RES\`" >> $GITHUB_STEP_SUMMARY

          echo "4. Verifying transaction-capable MongoDB and required Redis..."
          VERIFY_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 15 \
            --header "x-demo-expected-mongodb-database: $DEMO_DATABASE" \
            --header "x-demo-expected-mongodb-host: $DEMO_MONGO_HOST" \
            --header "x-demo-expected-mongodb-port: $DEMO_MONGO_PORT" \
            --header "x-demo-expected-mongodb-environment-id: $DEMO_ENVIRONMENT_ID" \
            http://127.0.0.1:5000/health/verification)
          echo "Verification Response: $VERIFY_RES"
          node -e 'const result=JSON.parse(process.argv[1]); if (result.status !== "DEMO_DATABASE_VERIFIED" || result.mongo?.transactionCapable !== true || result.mongo?.databaseIdentityVerified !== true || result.mongo?.environmentSentinelVerified !== true || result.redis?.required !== true || result.redis?.connected !== true) process.exit(1)' "$VERIFY_RES"

          echo "5. Testing Verified New-Regime Endpoint /api/tax/new-regime-verified..."
          TAX_URL="http://127.0.0.1:5000/api/tax/new-regime-verified"
          TAX_BODY='{"taxYear":"2026-27","incomeType":"salary","primaryIncome":"1275000.00","otherOrdinaryIncome":"0","residency":"resident","specialRateIncome":"no","confirmedOrdinaryOnly":true}'
          if ! TAX_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 10 \
            --request POST --header 'Content-Type: application/json' --data "$TAX_BODY" "$TAX_URL"); then
            echo "ERROR: new-regime tax smoke request failed: $TAX_URL"
            curl --silent --show-error --connect-timeout 5 --max-time 10 \
              --request POST --header 'Content-Type: application/json' --data "$TAX_BODY" "$TAX_URL" || true
            print_server_diagnostics
            exit 1
          fi
          echo "Verified New-Regime Response: $TAX_RES"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="CALCULATED"||x.finalTax!=="0"||x.taxableIncome!=="1200000") process.exit(1)' "$TAX_RES"
          echo "- **Verified New-Regime Tax Endpoint (/api/tax/new-regime-verified)**: \`$TAX_RES\`" >> $GITHUB_STEP_SUMMARY

      - name: Install frontend verification dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_market_preflight }}
        run: npm ci --prefix reactapp

      - name: Install Playwright Chromium for the authenticated Phase 15 journey
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_market_preflight }}
        run: reactapp/node_modules/.bin/playwright install --with-deps chromium

      - name: Execute complete Phase 15 live preflight against the attested Kind deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_market_preflight }}
        env:
          NODE_ENV: production
          MARKET_DATA_MODE: LEGACY
          MARKET_DATA_PRIMARY_PROVIDER: NSE
          DEMO_LIVE_PREFLIGHT: '1'
          DEMO_API_BASE_URL: https://127.0.0.1:8443/api
          DEMO_BACKEND_HEALTH_URL: http://127.0.0.1:5000
          DEMO_FRONTEND_URL: https://127.0.0.1:8443
          NODE_EXTRA_CA_CERTS: ${{ steps.phase15-tls.outputs.ca_path }}
          PHASE15_TLS_CERT_PATH: ${{ steps.phase15-tls.outputs.cert_path }}
          PHASE15_TLS_KEY_PATH: ${{ steps.phase15-tls.outputs.key_path }}
          PHASE15_TLS_UPSTREAM_URL: http://127.0.0.1:8080
          PHASE15_TLS_LISTEN_HOST: 127.0.0.1
          PHASE15_TLS_LISTEN_PORT: '8443'
          DEMO_EXPECTED_BUILD_SHA: ${{ github.sha }}
          DEMO_EXPECTED_BUILD_TREE_SHA: ${{ steps.build.outputs.git_tree_sha }}
          DEMO_EXPECTED_BUILD_PROVENANCE_SHA256: ${{ steps.build.outputs.provenance_sha256 }}
          DEMO_EXPECTED_FRONTEND_ARTIFACT_SET_SHA256: ${{ steps.build.outputs.frontend_artifact_set_sha256 }}
          DEMO_EXPECTED_MONGODB_DATABASE: ${{ steps.phase15-database.outputs.database }}
          DEMO_EXPECTED_MONGODB_HOST: ${{ steps.phase15-database.outputs.mongo_host }}
          DEMO_EXPECTED_MONGODB_PORT: ${{ steps.phase15-database.outputs.mongo_port }}
          DEMO_EXPECTED_MONGODB_ENVIRONMENT_ID: ${{ steps.phase15-database.outputs.environment_id }}
          EXPECTED_SERVER_IMAGE_ID: ${{ steps.build.outputs.server_image_id }}
          EXPECTED_FRONTEND_IMAGE_ID: ${{ steps.build.outputs.frontend_image_id }}
          EXPECTED_ML_IMAGE_ID: ${{ steps.build.outputs.ml_image_id }}
        run: |
          set -euo pipefail
          kubectl port-forward --address=127.0.0.1 -n wealthgenie svc/wealthgenie-server 5000:5000 > phase15-server-port-forward.log 2>&1 &
          SERVER_PORT_FORWARD_PID=$!
          kubectl port-forward --address=127.0.0.1 -n wealthgenie svc/wealthgenie-frontend 8080:80 > phase15-frontend-port-forward.log 2>&1 &
          FRONTEND_PORT_FORWARD_PID=$!
          node server/scripts/phase15LoopbackTlsProxy.js > phase15-tls-proxy.log 2>&1 &
          TLS_PROXY_PID=$!
          trap 'kill "$SERVER_PORT_FORWARD_PID" "$FRONTEND_PORT_FORWARD_PID" "$TLS_PROXY_PID" 2>/dev/null || true' EXIT

          wait_for_loopback() {
            local url="$1"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --connect-timeout 2 --max-time 5 "$url" > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "ERROR: scoped CI port-forward did not become ready: $url"
            return 1
          }
          wait_for_loopback http://127.0.0.1:5000/health/live
          wait_for_loopback https://127.0.0.1:8443/login
          node server/scripts/runPhase15CiPreflight.js

      - name: Explain skipped live-market preflight
        if: ${{ !inputs.run_live_market_preflight }}
        run: |
          echo "### Live-market Phase 15 preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped by default because it depends on current market-session/provider data. Deployment provenance, health, tax endpoint, and Kind smoke checks still ran. Start this workflow manually with **Run live-market preflight** enabled to run its strict authenticated browser checks." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Horizontal Pod Autoscaler & Load Response (Step 3)
        run: |
          set -euo pipefail
          echo "### Horizontal Pod Autoscaler (HPA) Verification (Step 3)" >> $GITHUB_STEP_SUMMARY

          echo "Starting a port-forward scoped to the HPA/load step..."
          kubectl port-forward --address=127.0.0.1 -n wealthgenie svc/wealthgenie-server 5000:5000 > hpa-port-forward.log 2>&1 &
          HPA_PORT_FORWARD_PID=$!
          trap 'kill "$HPA_PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 5 --max-time 10 http://127.0.0.1:5000/health/live > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ERROR: HPA-step server port-forward did not become ready"
              cat hpa-port-forward.log || true
              kubectl get pods -n wealthgenie -o wide || true
              kubectl get endpoints -n wealthgenie wealthgenie-server -o yaml || true
              exit 1
            fi
            sleep 2
          done

          if ! kubectl get hpa wealthgenie-server-hpa -n wealthgenie > /dev/null; then
            echo "ERROR: expected HPA wealthgenie-server-hpa does not exist"
            kubectl get hpa -n wealthgenie || true
            exit 1
          fi

          echo "Waiting until metrics-server reports server pod metrics..."
          SERVER_METRICS=""
          for attempt in $(seq 1 30); do
            SERVER_METRICS=$(kubectl top pods -n wealthgenie -l app=wealthgenie-server --no-headers 2>/tmp/wealthgenie-metrics-error || true)
            if echo "$SERVER_METRICS" | awk 'NF >= 3 { found = 1 } END { exit(found ? 0 : 1) }'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ERROR: server pod metrics were not available after bounded retries"
              cat /tmp/wealthgenie-metrics-error || true
              kubectl get pods -n wealthgenie -o wide || true
              kubectl describe deployment metrics-server -n kube-system || true
              exit 1
            fi
            sleep 2
          done
          echo "Initial server metrics: $SERVER_METRICS"

          LOAD_URL="http://127.0.0.1:5000/api/tax/new-regime-verified"
          TAX_BODY='{"taxYear":"2026-27","incomeType":"salary","primaryIncome":"1275000.00","otherOrdinaryIncome":"0","residency":"resident","specialRateIncome":"no","confirmedOrdinaryOnly":true}'
          if ! curl --fail --silent --connect-timeout 5 --max-time 10 \
            --request POST --header 'Content-Type: application/json' --data "$TAX_BODY" "$LOAD_URL" > /dev/null; then
            echo "ERROR: valid HPA load probe failed: $LOAD_URL"
            cat hpa-port-forward.log || true
            exit 1
          fi

          echo "Generating 15s synthetic compute load against cluster..."
          npm exec --prefix server -- autocannon -c 40 -d 15 -m POST -H 'content-type=application/json' -b "$TAX_BODY" "$LOAD_URL"

          HPA_TARGET=$(kubectl get hpa wealthgenie-server-hpa -n wealthgenie -o jsonpath='{.spec.metrics[0].resource.target.averageUtilization}')
          HPA_CURRENT=""
          for attempt in $(seq 1 30); do
            HPA_CURRENT=$(kubectl get hpa wealthgenie-server-hpa -n wealthgenie -o jsonpath='{.status.currentMetrics[0].resource.current.averageUtilization}' 2>/dev/null || true)
            if [[ "$HPA_CURRENT" =~ ^[0-9]+$ ]] && [[ "$HPA_TARGET" =~ ^[0-9]+$ ]]; then
              break
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          if ! [[ "$HPA_CURRENT" =~ ^[0-9]+$ ]] || ! [[ "$HPA_TARGET" =~ ^[0-9]+$ ]]; then
            echo "ERROR: HPA did not publish numeric current/target CPU utilization after load"
            kubectl describe hpa wealthgenie-server-hpa -n wealthgenie || true
            kubectl top pods -n wealthgenie -l app=wealthgenie-server || true
            exit 1
          fi

          HPA_STATUS=$(kubectl get hpa wealthgenie-server-hpa -n wealthgenie)
          echo "HPA Status after load:"
          echo "$HPA_STATUS"
          echo "HPA current CPU utilization: ${HPA_CURRENT}% / target: ${HPA_TARGET}%"
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "$HPA_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "Current CPU utilization: ${HPA_CURRENT}% / target: ${HPA_TARGET}%" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Capture Cluster Logs on Failure
        if: failure()
        run: |
          echo "Cluster pods status on failure:"
          kubectl get pods -n wealthgenie -o wide
          echo "--- Pod Events ---"
          kubectl get events -n wealthgenie --sort-by='.lastTimestamp' | tail -30
          echo "--- MongoDB Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-mongodb --tail=50
          echo "--- Redis Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-redis --tail=50
          echo "--- ML Service Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-ml-service --tail=80
          echo "--- Server Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-server --tail=50
          echo "--- Frontend Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-frontend --tail=50
